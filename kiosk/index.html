<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>借书机 - 校园图书馆</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { background: #2E3134 url('img/bg.png') center/cover fixed no-repeat; background-blend-mode: overlay; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .kiosk-container { width: 100%; max-width: 600px; padding: 24px; }
        .kiosk-card { background: #363b3f; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.4); padding: 32px 24px; color: #e0e0e0; }
        .kiosk-title { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 24px; color: var(--accent); }
        .btn-kiosk { font-size: 18px; padding: 14px 24px; border-radius: 12px; width: 100%; min-height: 56px; }
        .input-kiosk { font-size: 18px; padding: 14px 16px; border-radius: 12px; height: 56px; text-align: center; background: #24272a; border-color: #4a5056; color: #e0e0e0; }
        .input-kiosk:focus { background: #363b3f; border-color: var(--accent); color: #e0e0e0; }
        .input-kiosk::placeholder { color: #888; }
        .input-kiosk:-webkit-autofill,
        .input-kiosk:-webkit-autofill:hover,
        .input-kiosk:-webkit-autofill:focus { -webkit-text-fill-color: #e0e0e0; -webkit-box-shadow: 0 0 0 1000px #24272a inset; transition: background-color 5000s ease-in-out 0s; }
        .result-card { background: #24272a; border-radius: 12px; padding: 20px; margin-top: 16px; color: #e0e0e0; }
        .status-ok { color: #4ade80; font-weight: 600; }
        .status-no { color: #f87171; font-weight: 600; }
        .btn-primary { background: var(--accent); border-color: var(--accent); }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .btn-success { background: #4ade80; border-color: #4ade80; color: #2E3134; }
        .btn-success:hover { background: #22c55e; border-color: #22c55e; color: #2E3134; }
        .btn-outline-secondary { color: #bbb; border-color: #444; }
        .btn-outline-secondary:hover { background: #333; border-color: #555; color: #e0e0e0; }
        .alert-danger { background: #3a2d2d; border-color: #dc3545; color: #f87171; }
        .text-muted { color: #888 !important; }
        .keyboard-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; }
        .keyboard-container { position: fixed; bottom: 0; left: 0; right: 0; background: #24272a; border-top: 2px solid #4a5056; z-index: 1001; padding: 12px; display: none; }
        .keyboard-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 6px; }
        .keyboard-key { min-width: 40px; height: 48px; border-radius: 8px; background: #363b3f; border: 1px solid #4a5056; color: #e0e0e0; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
        .keyboard-key:active { background: var(--accent); }
        .keyboard-key.key-space { flex: 1; max-width: 200px; }
        .keyboard-key.key-backspace { min-width: 80px; background: #4a5056; }
        .keyboard-key.key-enter { min-width: 80px; background: var(--accent); color: #fff; }
        .keyboard-key.key-close { min-width: 60px; background: #dc3545; color: #fff; }
        .keyboard-key.key-shift { min-width: 80px; background: #4a5056; }
        .keyboard-key.key-shift.active { background: var(--accent); }
        .keyboard-key.key-pinyin { min-width: 60px; background: #6f42c1; color: #fff; }
        .pinyin-candidates { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; justify-content: center; }
        .pinyin-candidate { padding: 6px 12px; background: #363b3f; border: 1px solid #4a5056; border-radius: 6px; color: #e0e0e0; cursor: pointer; font-size: 16px; }
        .pinyin-candidate:active { background: var(--accent); }
        .pinyin-input-bar { display: flex; gap: 4px; margin-bottom: 8px; align-items: center; }
        .pinyin-text { flex: 1; padding: 8px; background: #363b3f; border: 1px solid #4a5056; border-radius: 6px; color: #e0e0e0; font-size: 16px; text-align: center; }
    </style>

    <script src="js/app.js"></script>
    <script>
        const app = document.getElementById('app');

        (function () {
            var s = document.createElement('style');
            s.textContent = '.site-name { color: var(--accent) !important; }';
            document.head.appendChild(s);
        })();

        function loadSiteName() {
            fetch('/api/system/config').then(r => r.json()).then(data => {
                if (data.code === 200 && data.data.site_name) {
                    document.querySelectorAll('.site-name').forEach(el => el.textContent = data.data.site_name);
                }
            }).catch(() => {});
        }
        loadSiteName();

        function renderLogin() {
            app.innerHTML = `
                <div class="kiosk-card">
                    <h3 class="kiosk-title"><i class="bi bi-book"></i> <span class="site-name">校园图书馆</span></h3>
                    <p class="text-center text-muted mb-4">借书机终端</p>
                    <input type="text" id="loginUsername" class="form-control input-kiosk mb-3" placeholder="用户名" autocomplete="username" readonly>
                    <input type="password" id="loginPassword" class="form-control input-kiosk mb-4" placeholder="密码" autocomplete="current-password" readonly>
                    <button id="loginBtn" class="btn btn-primary btn-kiosk">登 录</button>
                </div>`;

            document.getElementById('loginUsername').addEventListener('click', function () { showKeyboard(this); });
            document.getElementById('loginPassword').addEventListener('click', function () { showKeyboard(this); });

            document.getElementById('loginBtn').addEventListener('click', async function () {
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value;
                if (!username || !password) {
                    showToast('请输入用户名和密码', 'warning');
                    return;
                }
                this.disabled = true;
                this.textContent = '登录中...';
                const result = await apiPost('/auth/login', { username, password });
                this.disabled = false;
                this.textContent = '登 录';
                if (!result || result.code !== 200) {
                    showToast(result?.message || '登录失败', 'error');
                    return;
                }
                saveToken(result.data.token);
                saveUser(result.data.user);
                renderBorrow();
            });
        }

        function renderBorrow() {
            const user = getSavedUser();
            const blocked = user.credit_score < 3;

            app.innerHTML = `
                <div class="kiosk-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fs-5 fw-bold"><i class="bi bi-book"></i> 借书</span>
                        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">退出</button>
                    </div>
                    ${blocked ? '<div class="alert alert-danger text-center fs-5">信誉分不足，无法借书（当前：' + user.credit_score + '分）</div>' : ''}
                    <div class="mb-4">
                        <input type="text" id="isbnInput" class="form-control input-kiosk" placeholder="扫描ISBN / 输入图书编码" inputmode="none" ${blocked ? 'disabled' : ''}>
                    </div>
                    <button id="searchBtn" class="btn btn-primary btn-kiosk mb-3" ${blocked ? 'disabled' : ''}>
                        <i class="bi bi-search me-2"></i>查找图书
                    </button>
                    <div id="bookResult"></div>
                </div>`;

            document.getElementById('logoutBtn').addEventListener('click', async function () {
                await apiPost('/auth/logout', {});
                clearAuth();
                renderLogin();
            });

            if (!blocked) {
                const isbnInput = document.getElementById('isbnInput');
                isbnInput.focus();

                // 扫描枪适配：监听回车键自动搜索
                isbnInput.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        searchISBN();
                    }
                });

                // 触摸屏适配：点击弹出虚拟键盘
                isbnInput.addEventListener('click', function () { showKeyboard(this); });

                async function searchISBN() {
                    const isbn = document.getElementById('isbnInput').value.trim();
                    if (!isbn) return;

                    document.getElementById('searchBtn').disabled = true;
                    document.getElementById('searchBtn').textContent = '查找中...';
                    const result = await apiGet('/books?q=' + encodeURIComponent(isbn) + '&type=exact&per_page=5');
                    document.getElementById('searchBtn').disabled = false;
                    document.getElementById('searchBtn').textContent = '查找图书';

                    const container = document.getElementById('bookResult');
                    if (!result || result.code !== 200 || !result.data.items || result.data.items.length === 0) {
                        container.innerHTML = '<div class="result-card text-center text-muted fs-5">未找到匹配图书</div>';
                        return;
                    }

                    const book = result.data.items[0];
                    container.innerHTML = `
                        <div class="result-card">
                            <h5 class="mb-2">${escapeHtml(book.title)}</h5>
                            <p class="text-muted mb-1">${escapeHtml(book.author)} · ${escapeHtml(book.isbn)}</p>
                            <p class="mb-3 ${book.can_borrow ? 'status-ok' : 'status-no'}">
                                可借副本: ${book.available_copies} / ${book.total_copies}
                                ${book.can_borrow ? '' : ' · 不可借'}
                            </p>
                            <button class="btn btn-success btn-kiosk borrow-btn" data-id="${book.id}" data-title="${escapeHtml(book.title)}" ${book.can_borrow ? '' : 'disabled'}>
                                <i class="bi bi-check-circle me-2"></i>确认借阅
                            </button>
                        </div>`;

                    container.querySelector('.borrow-btn')?.addEventListener('click', async function () {
                        this.disabled = true;
                        this.textContent = '处理中...';
                        const bookId = parseInt(this.dataset.id);
                        const result = await apiPost('/borrow/request', { book_id: bookId });
                        if (!result || result.code !== 200) {
                            showToast(result?.message || '借书失败', 'error');
                            this.disabled = false;
                            this.textContent = '确认借阅';
                            return;
                        }
                        container.innerHTML = `
                            <div class="result-card text-center">
                                <i class="bi bi-check-circle text-success" style="font-size: 3rem;"></i>
                                <h5 class="mt-2">借阅成功！</h5>
                                <p class="fs-5 mb-1">《${escapeHtml(this.dataset.title)}》</p>
                                <p class="text-muted fs-5">应还日期：${result.data.due_date}</p>
                                <p class="text-muted">借阅 ${result.data.borrow_days} 天</p>
                                <button class="btn btn-primary btn-kiosk mt-3" onclick="location.reload()">继续借书</button>
                            </div>`;
                    });
                }

                document.getElementById('searchBtn').addEventListener('click', searchISBN);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateKeyboardCase() {
            const rows = ['row1', 'row2', 'row3'];
            rows.forEach(rowId => {
                const row = document.getElementById(rowId);
                if (!row) return;
                row.querySelectorAll('.keyboard-key[data-key]').forEach(key => {
                    const keyVal = key.dataset.key;
                    if (keyVal.length === 1 && /[a-zA-Z]/.test(keyVal)) {
                        key.textContent = isUpperCase ? keyVal.toUpperCase() : keyVal.toLowerCase();
                        key.dataset.key = isUpperCase ? keyVal.toUpperCase() : keyVal.toLowerCase();
                    }
                });
            });
            const shiftKey = document.querySelector('.keyboard-key[data-key="SHIFT"]');
            if (shiftKey) {
                shiftKey.classList.toggle('active', isUpperCase);
            }
        }

        function updatePinyinCandidates() {
            const candidatesDiv = document.getElementById('pinyinCandidates');
            const pinyinText = document.getElementById('pinyinText');
            if (!candidatesDiv || !pinyinText) return;

            pinyinText.textContent = pinyinBuffer;

            if (pinyinBuffer.length === 0) {
                candidatesDiv.innerHTML = '';
                return;
            }

            const candidates = pinyinMap[pinyinBuffer.toLowerCase()] || [];
            candidatesDiv.innerHTML = candidates.map(c =>
                '<div class="pinyin-candidate" data-char="' + c + '">' + c + '</div>'
            ).join('');

            candidatesDiv.querySelectorAll('.pinyin-candidate').forEach(el => {
                el.addEventListener('click', function () {
                    if (currentInput) {
                        currentInput.value += this.dataset.char;
                    }
                    pinyinBuffer = '';
                    updatePinyinCandidates();
                });
            });
        }

        function showKeyboard(inputElement) {
            currentInput = inputElement;
            document.getElementById('keyboardOverlay').style.display = 'block';
            document.getElementById('keyboardContainer').style.display = 'block';
            updateKeyboardCase();
        }

        function hideKeyboard() {
            currentInput = null;
            pinyinMode = false;
            pinyinBuffer = '';
            document.getElementById('pinyinBar').style.display = 'none';
            document.getElementById('keyboardOverlay').style.display = 'none';
            document.getElementById('keyboardContainer').style.display = 'none';
        }

        document.getElementById('keyboardOverlay').addEventListener('click', hideKeyboard);

        document.querySelectorAll('.keyboard-key').forEach(key => {
            key.addEventListener('click', function () {
                if (!currentInput) return;
                const keyValue = this.dataset.key;

                if (keyValue === 'BACKSPACE') {
                    if (pinyinMode && pinyinBuffer.length > 0) {
                        pinyinBuffer = pinyinBuffer.slice(0, -1);
                        updatePinyinCandidates();
                    } else {
                        currentInput.value = currentInput.value.slice(0, -1);
                    }
                } else if (keyValue === 'ENTER') {
                    if (pinyinMode) {
                        if (pinyinBuffer.length > 0) {
                            currentInput.value += pinyinBuffer;
                            pinyinBuffer = '';
                            updatePinyinCandidates();
                        }
                    } else {
                        hideKeyboard();
                        currentInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
                    }
                } else if (keyValue === 'CLOSE') {
                    hideKeyboard();
                } else if (keyValue === 'PYCLOSE') {
                    pinyinMode = false;
                    pinyinBuffer = '';
                    document.getElementById('pinyinBar').style.display = 'none';
                } else if (keyValue === 'SHIFT') {
                    isUpperCase = !isUpperCase;
                    updateKeyboardCase();
                } else if (keyValue === 'PINYIN') {
                    pinyinMode = !pinyinMode;
                    if (pinyinMode) {
                        document.getElementById('pinyinBar').style.display = 'block';
                        pinyinBuffer = '';
                        updatePinyinCandidates();
                    } else {
                        document.getElementById('pinyinBar').style.display = 'none';
                        pinyinBuffer = '';
                    }
                } else if (pinyinMode && /[a-zA-Z]/.test(keyValue)) {
                    pinyinBuffer += keyValue.toLowerCase();
                    updatePinyinCandidates();
                } else {
                    currentInput.value += keyValue;
                }
                currentInput.focus();
            });
        });

        if (isLoggedIn()) {
            renderBorrow();
        } else {
            renderLogin();
        }
