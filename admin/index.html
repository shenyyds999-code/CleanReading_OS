<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 校园图书馆</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --sidebar-w: 240px; --bg: #1a1d21; --card-bg: #24272a; --border: #3a3f44; --text: #e0e0e0; --muted: #999; --accent: #FF6699; }
        body { background: var(--bg) url('img/bg-admin.png') center/cover fixed no-repeat; background-blend-mode: overlay; color: var(--text); min-height: 100vh; font-family: system-ui, -apple-system, sans-serif; }
        .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh; background: #1e2125; border-right: 1px solid var(--border); z-index: 1000; overflow-y: auto; }
        .sidebar-header { padding: 1.25rem; border-bottom: 1px solid var(--border); }
        .sidebar-header h5 { color: var(--accent); margin: 0; font-weight: 700; }
        .sidebar-header small { color: var(--muted); }
        .sidebar-nav { padding: 0.75rem 0; }
        .sidebar-nav .nav-link { color: #aaa; padding: 0.6rem 1.25rem; border-left: 3px solid transparent; font-size: 0.9rem; transition: all .15s; }
        .sidebar-nav .nav-link:hover { color: #fff; background: rgba(255,255,255,0.04); }
        .sidebar-nav .nav-link.active { color: var(--accent); background: var(--accent-alpha10); border-left-color: var(--accent); }
        .sidebar-nav .nav-link i { width: 20px; text-align: center; margin-right: 8px; }
        .sidebar-footer { padding: 1rem 1.25rem; border-top: 1px solid var(--border); position: absolute; bottom: 0; width: 100%; }
        .main { margin-left: var(--sidebar-w); min-height: 100vh; }
        .topbar { background: #1e2125; border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; position: sticky; top: 0; z-index: 999; }
        .content { padding: 1.5rem; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; transition: all .15s; }
        .stat-card:hover { border-color: #555; }
        .stat-card .stat-icon { font-size: 2rem; }
        .stat-card .stat-value { font-size: 1.75rem; font-weight: 700; }
        .stat-card .stat-label { color: var(--muted); font-size: 0.85rem; }
        .card { background: var(--card-bg); border: 1px solid var(--border); }
        .card-header { background: #1e2125; border-bottom: 1px solid var(--border); color: var(--text); }
        .table { color: var(--text); }
        .table > :not(caption) > * > * { background: transparent; border-bottom-color: var(--border); color: var(--text); }
        .table > thead > tr > th { color: #aaa; font-weight: 600; border-bottom: 2px solid var(--border); }
        .table > tbody > tr:hover { background: rgba(255,255,255,0.03); }
        .form-control, .form-select { background: #1a1d21; border-color: var(--border); color: var(--text); }
        .form-control:focus, .form-select:focus { background: #1a1d21; border-color: var(--accent); color: var(--text); box-shadow: 0 0 0 0.2rem var(--accent-alpha15); }
        .form-label { color: #ccc; }
        .btn-primary { background: var(--accent); border-color: var(--accent); }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .btn-outline-primary { color: var(--accent); border-color: var(--accent); }
        .btn-outline-primary:hover { background: var(--accent); color: #fff; }
        .badge { font-weight: 500; }
        .pagination .page-link { background: var(--card-bg); border-color: var(--border); color: var(--text); }
        .pagination .page-link:hover { background: #363b3f; color: #fff; }
        .pagination .active .page-link { background: var(--accent); border-color: var(--accent); }
        .modal-content { background: var(--card-bg); border-color: var(--border); }
        .modal-header, .modal-footer { border-color: var(--border); }
        .image-thumb { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; cursor: pointer; }
        .nav-pills .nav-link { color: #aaa; }
        .nav-pills .nav-link.active { background: var(--accent); }
        .section-title { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 1rem; }
        .section-title i { color: var(--accent); }
        @media (max-width: 768px) { .sidebar { display: none; } .main { margin-left: 0; } }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <aside class="sidebar d-flex flex-column">
        <div class="sidebar-header">
            <h5><i class="bi bi-shield-lock me-2"></i>管理后台</h5>
            <small id="sidebarUsername"></small>
        </div>
        <nav class="sidebar-nav flex-grow-1">
            <a href="#" class="nav-link active" data-panel="dashboard"><i class="bi bi-speedometer2"></i> 仪表盘</a>
            <a href="#" class="nav-link" data-panel="books"><i class="bi bi-book"></i> 书籍管理</a>
            <a href="#" class="nav-link" data-panel="returns"><i class="bi bi-arrow-return-left"></i> 还书审核</a>
            <a href="#" class="nav-link" data-panel="donations"><i class="bi bi-gift"></i> 捐书审核</a>
            <a href="#" class="nav-link" data-panel="images"><i class="bi bi-image"></i> 图片审核</a>
            <a href="#" class="nav-link" data-panel="comments"><i class="bi bi-chat-dots"></i> 评论管理</a>
            <a href="#" class="nav-link super-only" data-panel="users" style="display:none;"><i class="bi bi-people"></i> 用户管理</a>
            <a href="#" class="nav-link" data-panel="quizzes"><i class="bi bi-lightbulb"></i> 题目管理</a>
        </nav>
        <div class="sidebar-footer">
            <button class="btn btn-outline-secondary btn-sm w-100" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>退出登录</button>
        </div>
    </aside>

    <main class="main">
        <div class="topbar d-flex align-items-center justify-content-between">
            <span class="fw-semibold"><span id="topbarTitle">仪表盘</span></span>
            <div class="d-flex align-items-center gap-3">
                <span id="roleTag"></span>
                <span class="text-muted small" id="topbarUser"></span>
            </div>
        </div>

        <div class="content">
            <div id="panel-loading" class="text-center py-5"><div class="spinner-border" style="color:var(--accent)"></div></div>

            <div id="panel-dashboard" class="d-none">
                <div class="row g-3 mb-4" id="statCards"></div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="card"><div class="card-header"><i class="bi bi-clock-history me-2"></i>快速操作</div>
                            <div class="card-body">
                                <a href="#" class="btn btn-outline-primary btn-sm me-2 mb-2 nav-switch" data-panel="books"><i class="bi bi-plus-circle"></i> 添加书籍</a>
                                <a href="#" class="btn btn-outline-primary btn-sm me-2 mb-2 nav-switch" data-panel="returns"><i class="bi bi-check-circle"></i> 审核还书</a>
                                <a href="#" class="btn btn-outline-primary btn-sm me-2 mb-2 nav-switch" data-panel="donations"><i class="bi bi-gift"></i> 审核捐书</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card"><div class="card-header"><i class="bi bi-info-circle me-2"></i>系统信息</div>
                            <div class="card-body" id="sysInfo" style="font-size:0.9rem;color:#999;"></div>
                        </div>
                    </div>
                </div>
                <div class="row g-3 mt-3" id="sysConfigRow" style="display:none;">
                    <div class="col-md-6">
                        <div class="card"><div class="card-header"><i class="bi bi-sliders me-2"></i>系统配置</div>
                            <div class="card-body">
                                <div class="row align-items-end g-2">
                                    <div class="col-md-12">
                                        <label class="form-label">站点名称</label>
                                        <div class="input-group">
                                            <input type="text" class="form-control" id="sysSiteNameInput">
                                            <button class="btn btn-primary" id="saveSiteNameBtn">保存</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="panel-books" class="d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="section-title"><i class="bi bi-book me-2"></i>书籍管理</h6>
                    <div class="d-flex gap-2">
                        <input type="text" class="form-control form-control-sm" id="bookSearch" placeholder="搜索书名/作者/ISBN..." style="width:240px;">
                        <button class="btn btn-primary btn-sm" id="addBookBtn"><i class="bi bi-plus-lg"></i> 新书录入</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm align-middle">
                        <thead><tr><th>ID</th><th>书名</th><th>作者</th><th>ISBN</th><th>分类</th><th>馆藏</th><th>状态</th><th>操作</th></tr></thead>
                        <tbody id="bookTableBody"></tbody>
                    </table>
                </div>
                <nav id="bookPagination" class="d-flex justify-content-center mt-3"></nav>
            </div>

            <div id="panel-returns" class="d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="section-title"><i class="bi bi-arrow-return-left me-2"></i>还书审核</h6>
                    <select class="form-select form-select-sm" id="returnFilter" style="width:160px;">
                        <option value="">全部状态</option>
                        <option value="已提交归还">待审核</option>
                        <option value="已归还">已归还</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm align-middle">
                        <thead><tr><th>ID</th><th>用户</th><th>书名</th><th>借阅日期</th><th>归还日期</th><th>照片</th><th>状态</th><th>操作</th></tr></thead>
                        <tbody id="returnTableBody"></tbody>
                    </table>
                </div>
                <nav id="returnPagination" class="d-flex justify-content-center mt-3"></nav>
            </div>

            <div id="panel-donations" class="d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="section-title"><i class="bi bi-gift me-2"></i>捐书审核</h6>
                    <select class="form-select form-select-sm" id="donationFilter" style="width:160px;">
                        <option value="">全部状态</option>
                        <option value="待审核">待审核</option>
                        <option value="已审核">已通过</option>
                        <option value="已拒绝">已拒绝</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm align-middle">
                        <thead><tr><th>ID</th><th>用户</th><th>书名</th><th>损坏描述</th><th>照片</th><th>状态</th><th>操作</th></tr></thead>
                        <tbody id="donationTableBody"></tbody>
                    </table>
                </div>
                <nav id="donationPagination" class="d-flex justify-content-center mt-3"></nav>
            </div>

            <div id="panel-images" class="d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="section-title"><i class="bi bi-image me-2"></i>图片审核</h6>
                    <select class="form-select form-select-sm" id="imageFilter" style="width:160px;">
                        <option value="">全部</option>
                        <option value="待审核">待审核</option>
                        <option value="已通过">已通过</option>
                        <option value="已拒绝">已拒绝</option>
                    </select>
                </div>
                <div class="row g-3" id="imageGrid"></div>
                <nav id="imagePagination" class="d-flex justify-content-center mt-3"></nav>
            </div>

            <div id="panel-comments" class="d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="section-title"><i class="bi bi-chat-dots me-2"></i>评论管理</h6>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="reportedOnly">
                        <label class="form-check-label" for="reportedOnly">仅显示被举报</label>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm align-middle">
                        <thead><tr><th>ID</th><th>用户</th><th>书籍</th><th>内容</th><th>点赞</th><th>状态</th><th>操作</th></tr></thead>
                        <tbody id="commentTableBody"></tbody>
                    </table>
                </div>
                <nav id="commentPagination" class="d-flex justify-content-center mt-3"></nav>
            </div>

            <div id="panel-users" class="d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="section-title"><i class="bi bi-people me-2"></i>用户管理</h6>
                    <input type="text" class="form-control form-control-sm" id="userSearch" placeholder="搜索用户名..." style="width:200px;">
                </div>
                <div class="table-responsive">
                    <table class="table table-sm align-middle">
                        <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>信誉分</th><th>在借</th><th>注册时间</th><th>操作</th></tr></thead>
                        <tbody id="userTableBody"></tbody>
                    </table>
                </div>
                <nav id="userPagination" class="d-flex justify-content-center mt-3"></nav>
            </div>

            <div id="panel-quizzes" class="d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="section-title"><i class="bi bi-lightbulb me-2"></i>题目管理</h6>
                    <div class="d-flex gap-2">
                        <select class="form-select form-select-sm" id="quizBookSelect" style="width:200px;">
                            <option value="">选择图书...</option>
                        </select>
                        <input type="number" class="form-control form-control-sm" id="quizCount" value="5" min="1" max="10" style="width:80px;">
                        <button class="btn btn-success btn-sm" id="generateQuizBtn"><i class="bi bi-magic"></i> AI 生成题目</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm align-middle">
                        <thead><tr><th>ID</th><th>书名</th><th>题目</th><th>正确答案</th><th>分值</th><th>操作</th></tr></thead>
                        <tbody id="quizTableBody"></tbody>
                    </table>
                </div>
                <nav id="quizPagination" class="d-flex justify-content-center mt-3"></nav>
            </div>
        </div>
    </main>

    <div class="modal fade" id="bookModal" tabindex="-1">
        <div class="modal-dialog modal-lg"><div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="bookModalTitle">添加图书</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <form id="bookForm">
                    <input type="hidden" id="bookEditId">
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">书名 *</label><input type="text" class="form-control" id="bookTitle" required></div>
                        <div class="col-md-6"><label class="form-label">作者 *</label><input type="text" class="form-control" id="bookAuthor" required></div>
                        <div class="col-md-4"><label class="form-label">ISBN</label><div class="input-group"><input type="text" class="form-control" id="bookIsbn"><button class="btn btn-outline-info" type="button" id="isbnLookupBtn" title="通过ISBN自动获取书籍信息"><i class="bi bi-search"></i> 填充</button></div></div>
                        <div class="col-md-4"><label class="form-label">分类</label><input type="text" class="form-control" id="bookCategory"></div>
                        <div class="col-md-4"><label class="form-label">出版社</label><input type="text" class="form-control" id="bookPublisher"></div>
                        <div class="col-md-4"><label class="form-label">总册数</label><input type="number" class="form-control" id="bookTotalCopies" value="1" min="1"></div>
                        <div class="col-md-4"><label class="form-label">位置</label><input type="text" class="form-control" id="bookLocation"></div>
                        <div class="col-md-4"><label class="form-label">封面URL</label><div class="input-group"><input type="text" class="form-control" id="bookCoverUrl"><button class="btn btn-outline-warning" type="button" id="uploadCoverBtn" title="上传封面图片"><i class="bi bi-upload"></i> 上传封面</button></div></div><input type="file" id="coverFileInput" accept="image/*" style="display:none;">
                        <div class="col-12"><label class="form-label">简介</label><textarea class="form-control" id="bookDesc" rows="3"></textarea></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveBookBtn">保存</button>
            </div>
        </div></div>
    </div>

    <div class="modal fade" id="creditModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">调整信誉分</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <p class="text-muted" id="creditModalUser"></p>
                <div class="mb-3"><label class="form-label">变动值（正数为加分，负数为扣分）</label><input type="number" class="form-control" id="creditAmount" required></div>
                <div class="mb-3"><label class="form-label">原因 *</label><input type="text" class="form-control" id="creditReason" required></div>
                <div class="mb-3"><label class="form-label">备注</label><input type="text" class="form-control" id="creditDetail"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveCreditBtn">确认调整</button>
            </div>
        </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script>
(function () {
    const user = checkAdminAuth();
    if (!user) return;

    document.getElementById('sidebarUsername').textContent = user.username;
    document.getElementById('topbarUser').textContent = '欢迎，' + user.username;
    document.getElementById('roleTag').innerHTML = getRoleName(user.role);

    if (user.role === 3) {
        document.querySelectorAll('.super-only').forEach(el => el.style.display = '');
    }

    let currentPanel = 'dashboard';
    let bookEditId = null;
    let creditUserId = null;

    const panels = ['dashboard', 'books', 'returns', 'donations', 'images', 'comments', 'users', 'quizzes'];
    const panelTitles = { dashboard: '仪表盘', books: '书籍管理', returns: '还书审核', donations: '捐书审核', images: '图片审核', comments: '评论管理', users: '用户管理', quizzes: '题目管理' };

    function switchPanel(name) {
        currentPanel = name;
        panels.forEach(p => document.getElementById('panel-' + p).classList.add('d-none'));
        document.getElementById('panel-' + name).classList.remove('d-none');
        document.getElementById('topbarTitle').textContent = panelTitles[name];
        document.querySelectorAll('.sidebar-nav .nav-link').forEach(l => l.classList.remove('active'));
        document.querySelector('.sidebar-nav .nav-link[data-panel="' + name + '"]').classList.add('active');
        loadPanel(name);
    }

    document.querySelectorAll('.sidebar-nav .nav-link, .nav-switch').forEach(link => {
        link.addEventListener('click', function (e) {
            e.preventDefault();
            const panel = this.dataset.panel;
            if (panel && panels.includes(panel)) switchPanel(panel);
        });
    });

    async function loadPanel(name) {
        document.getElementById('panel-loading').classList.add('d-none');
        if (name === 'dashboard') await loadDashboard();
        else if (name === 'books') await loadBooks();
        else if (name === 'returns') await loadReturns();
        else if (name === 'donations') await loadDonations();
        else if (name === 'images') await loadImages();
        else if (name === 'comments') await loadComments();
        else if (name === 'users') await loadUsers();
        else if (name === 'quizzes') await loadQuizzes();
    }

    async function loadDashboard() {
        const r = await adminGet('/admin/stats');
        if (!r) return;
        const stats = r.data;
        const cards = [
            { icon: 'bi-book', color: 'var(--accent)', value: stats.total_books, label: '图书总量' },
            { icon: 'bi-people', color: '#4fc3f7', value: stats.total_users, label: '用户总数' },
            { icon: 'bi-bookmark-check', color: '#81c784', value: stats.total_borrowing, label: '在借图书' },
            { icon: 'bi-arrow-return-left', color: '#ffb74d', value: stats.pending_returns, label: '待审核还书' },
            { icon: 'bi-gift', color: '#ba68c8', value: stats.pending_donations, label: '待审核捐书' },
            { icon: 'bi-image', color: '#4dd0e1', value: stats.pending_images, label: '待审核图片' },
            { icon: 'bi-chat-dots', color: '#ef5350', value: stats.reported_comments, label: '被举报评论' },
            { icon: 'bi-exclamation-triangle', color: '#ff8a65', value: stats.overdue_count, label: '超期未还' }
        ];
        document.getElementById('statCards').innerHTML = cards.map(c =>
            '<div class="col-6 col-md-3"><div class="stat-card"><div class="d-flex justify-content-between align-items-start"><div><div class="stat-value">' + c.value + '</div><div class="stat-label">' + c.label + '</div></div><i class="bi ' + c.icon + ' stat-icon" style="color:' + c.color + '"></i></div></div></div>'
        ).join('');
        document.getElementById('sysInfo').innerHTML =
            '<div>当前角色：' + getRoleName(user.role) + '</div>' +
            '<div>数据库引擎：MySQL</div>' +
            '<div>缓存状态：' + (stats.redis_enabled ? '已启用' : '内存模式') + '</div>';

        if (user.role === 3) {
            document.getElementById('sysConfigRow').style.display = '';
            fetch(API_BASE + '/system/config')
                .then(r => r.json())
                .then(data => {
                    if (data.code === 200) {
                        document.getElementById('sysSiteNameInput').value = data.data.site_name || '';
                    }
                }).catch(() => {});
        }
    }

    async function loadBooks(page = 1) {
        const q = document.getElementById('bookSearch').value;
        const r = await adminGet('/admin/books?page=' + page + '&q=' + encodeURIComponent(q));
        if (!r) return;
        document.getElementById('bookTableBody').innerHTML = r.data.items.map(b =>

    function renderPagination(wrapperId, total, page, perPage, loadFn) {
        const pages = Math.ceil(total / perPage);
        if (pages <= 1) { document.getElementById(wrapperId).innerHTML = ''; return; }
        let html = '<ul class="pagination pagination-sm">';
        for (let i = 1; i <= pages; i++) {
            html += '<li class="page-item' + (i === page ? ' active' : '') + '"><a class="page-link" href="#" data-page="' + i + '">' + i + '</a></li>';
        }
        html += '</ul>';
        document.getElementById(wrapperId).innerHTML = html;
        document.getElementById(wrapperId).querySelectorAll('.page-link').forEach(link => {
            link.addEventListener('click', function (e) { e.preventDefault(); loadFn(parseInt(this.dataset.page)); });
        });
    }

    document.getElementById('coverFileInput').addEventListener('change', async function (e) {

        if (!file) return;
        if (!file.type.startsWith('image/')) {
            showToast('请选择图片文件', 'error');
            return;
        }
        if (file.size > 5 * 1024 * 1024) {
            showToast('图片大小不能超过5MB', 'error');
            return;
        }
        const btn = document.getElementById('uploadCoverBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>上传中';
        const formData = new FormData();
        formData.append('file', file);
        try {
            const r = await fetch(API_BASE + '/admin/upload-image', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + getToken() },
                body: formData
            }).then(res => res.json());
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-upload"></i> 上传封面';
            if (r.code === 200) {
                document.getElementById('bookCoverUrl').value = r.data.url;
                showToast('封面上传成功', 'success');
            } else {
                showToast(r.message || '上传失败', 'error');

            btn.disabled = false;

        }

    });

    });

    document.getElementById('saveSiteNameBtn').addEventListener('click', async function () {
        const name = document.getElementById('sysSiteNameInput').value.trim();
        if (!name) { showToast('站点名称不能为空', 'error'); return; }
        const r = await adminPut('/system/config', { site_name: name });
        if (!r) return;
        if (r.code === 200) {
            showToast('站点名称已更新为：' + name, 'success');
            document.querySelectorAll('.site-name').forEach(el => el.textContent = name);
            document.title = document.title.replace(/校园图书馆/g, name);
        } else {
            showToast(r.message, 'error');
        }
    });

    switchPanel('dashboard');
})();
    </script>
</body>
</html>
