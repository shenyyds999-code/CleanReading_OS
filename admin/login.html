<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理端登录 - 校园图书馆</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #1a1d21 url('img/bg-admin.png') center/cover fixed no-repeat; background-blend-mode: overlay; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #24272a; border: 1px solid #3a3f44; border-radius: 12px; width: 100%; max-width: 420px; }
        .form-control { background: #1a1d21; border-color: #3a3f44; color: #e0e0e0; }
        .form-control:focus { background: #1a1d21; border-color: var(--accent); color: #e0e0e0; box-shadow: 0 0 0 0.2rem var(--accent-alpha25); }
        .form-control::placeholder { color: #888; }
        .form-control:-webkit-autofill,
        .form-control:-webkit-autofill:hover,
        .form-control:-webkit-autofill:focus { -webkit-text-fill-color: #e0e0e0; -webkit-box-shadow: 0 0 0 1000px #1a1d21 inset; transition: background-color 5000s ease-in-out 0s; }
        .form-label { color: #bbb; }
        .btn-primary { background: var(--accent); border-color: var(--accent); }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .text-muted { color: #999 !important; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <div class="login-card shadow-lg p-4 p-md-5">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock" style="font-size: 3rem; color: var(--accent);"></i>
            <h3 class="mt-2" style="color:#e0e0e0;">管理后台</h3>
            <p class="text-muted"><span class="site-name">校园图书馆</span>借阅系统</p>
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label">密码</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">
                <i class="bi bi-box-arrow-in-right me-2"></i>登 录
            </button>
        </form>
        <div class="text-center mt-4">
            <a href="../client/index.html" class="text-muted small text-decoration-none">
                <i class="bi bi-arrow-left"></i> 返回客户端
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api';

        (function () {
            var s = document.createElement('style');
            s.textContent = '.site-name { color: var(--accent) !important; visibility: hidden; }';
            document.head.appendChild(s);
        })();

        (function loadSiteName() {
            fetch(API_BASE + '/system/config')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.code === 200 && data.data.site_name) {
                        var name = data.data.site_name;
                        document.title = document.title.replace(/校园图书馆/g, name);
                        var els = document.querySelectorAll('.site-name');
                        for (var i = 0; i < els.length; i++) {
                            els[i].textContent = name;
                            els[i].style.visibility = 'visible';
                        }
                    } else {
                        var els = document.querySelectorAll('.site-name');
                        for (var i = 0; i < els.length; i++) els[i].style.visibility = 'visible';
                    }
                }).catch(function () {
                    var els = document.querySelectorAll('.site-name');
                    for (var i = 0; i < els.length; i++) els[i].style.visibility = 'visible';
                });
        })();

        function getSavedUser() { try { return JSON.parse(localStorage.getItem('library_user') || 'null'); } catch { return null; } }
        function saveToken(t) { localStorage.setItem('library_token', t); }
        function saveUser(u) { localStorage.setItem('library_user', JSON.stringify(u)); }

        function showToast(msg, type) {
            const container = document.getElementById('toast-container');
            const id = 't' + Date.now();
            const bg = type === 'error' ? 'bg-danger' : 'bg-success';
            container.insertAdjacentHTML('beforeend',
                '<div id="' + id + '" class="toast align-items-center text-white ' + bg + ' border-0" role="alert"><div class="d-flex"><div class="toast-body">' + msg + '</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>');
            const el = document.getElementById(id);
            new bootstrap.Toast(el, { delay: 3000 }).show();
            el.addEventListener('hidden.bs.toast', () => el.remove());
        }

        (function () {
            const user = getSavedUser();
            if (user && (user.role === 2 || user.role === 3)) {
                window.location.href = 'index.html';
                return;
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>登录中...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const resp = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await resp.json();

                if (data.code !== 200) {
                    showToast(data.message || '登录失败', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>登 录';
                    return;
                }

                const userData = data.data.user;
                if (userData.role !== 2 && userData.role !== 3) {
                    showToast('仅限管理员登录', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>登 录';
                    return;
                }

                saveToken(data.data.token);
                saveUser(userData);
                window.location.href = 'index.html';
            } catch (err) {
                showToast('网络错误，请重试', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>登 录';
            }
        });
    </script>
</body>
</html>
