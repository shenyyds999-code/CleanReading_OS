<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理端登录 - 校园图书馆</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(rgba(250,251,254,0.92), rgba(250,251,254,0.92)), url('img/bg-admin.png') center/cover fixed no-repeat; min-height: 100vh; display: flex; flex-direction: column; color: #1b1622; }

        /* 顶部导航栏 */
        .top-nav { background: #ffffff; border-bottom: 1px solid #dfe2ea; padding: 0 clamp(1rem, 4vw, 2.5rem); height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .top-nav .brand { color: var(--accent); font-weight: 700; font-size: 1.15rem; text-decoration: none; letter-spacing: .5px; }
        .top-nav .nav-links { display: flex; align-items: center; gap: 1.25rem; }
        .top-nav .nav-link-item { color: #5f5a66; text-decoration: none; font-size: 0.925rem; }
        .top-nav .nav-link-item:hover { color: var(--accent); }

        /* 主体 */
        .main-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
        .login-panel { width: 100%; max-width: 440px; }
        .login-box { background: #ffffff; border: 1px solid #dfe2ea; border-radius: 0; box-shadow: 0 8px 32px rgba(27,22,34,0.10); padding: 2.5rem; }
        .login-title { font-size: 1.75rem; font-weight: 700; color: #1b1622; margin-bottom: .35rem; }
        .login-subtitle { color: #5f5a66; margin-bottom: 1.75rem; }
        .login-title .bi { color: var(--accent); }

        /* 直角输入框 */
        .form-control { border-radius: 0; background: #ffffff; border-color: #d5d9e3; color: #1b1622; padding: .75rem .9rem; }
        .form-control:focus { background: #ffffff; border-color: var(--accent); color: #1b1622; box-shadow: 0 0 0 0.2rem var(--accent-alpha15); }
        .form-control::placeholder { color: #9c98a6; }
        .form-control:-webkit-autofill,
        .form-control:-webkit-autofill:hover,
        .form-control:-webkit-autofill:focus { -webkit-text-fill-color: #1b1622; -webkit-box-shadow: 0 0 0 1000px #ffffff inset; transition: background-color 5000s ease-in-out 0s; }
        .form-label { color: #5f5a66; font-size: .9rem; }

        /* 直角按钮 */
        .btn-primary { border-radius: 0; background: var(--accent); border-color: var(--accent); padding: .8rem; font-size: 1rem; }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .text-muted { color: #6c757d !important; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <nav class="top-nav">
        <a href="index.html" class="brand"><i class="bi bi-shield-lock me-2"></i><span class="site-name">校园图书馆</span>管理后台</a>
        <div class="nav-links">
            <a href="../client/index.html" class="nav-link-item"><i class="bi bi-arrow-left me-1"></i>返回客户端</a>
        </div>
    </nav>

    <main class="main-area">
        <div class="login-panel">
            <div class="login-box">
                <h1 class="login-title"><i class="bi bi-shield-lock me-2"></i>管理登录</h1>
                <p class="login-subtitle">仅限图书管理员及超级管理员账户</p>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" required autofocus autocomplete="username">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">密码</label>
                        <input type="password" class="form-control" id="password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                        <i class="bi bi-box-arrow-in-right me-2"></i>登 录
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api';

        (function () {
            var s = document.createElement('style');
            s.textContent = '.site-name { color: var(--accent) !important; visibility: hidden; }';
            document.head.appendChild(s);
        })();

        (function () {
            try {
                var cached = localStorage.getItem('accent_color');
                var hex = (cached && /^#[0-9a-fA-F]{6}$/.test(cached) && cached.toLowerCase() !== '#ff6699') ? cached : '#4b1e1e';
                localStorage.setItem('accent_color', hex);
                var r = parseInt(hex.slice(1, 3), 16);
                var g = parseInt(hex.slice(3, 5), 16);
                var b = parseInt(hex.slice(5, 7), 16);
                var hr = Math.max(0, r - 35);
                var hg = Math.max(0, g - 17);
                var hb = Math.max(0, b - 25);
                var hover = '#' + [hr, hg, hb].map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
                var style = document.createElement('style');
                style.id = 'accent-style';
                style.textContent = ':root { --accent: ' + hex + '; --accent-hover: ' + hover + '; --accent-alpha25: rgba(' + r + ',' + g + ',' + b + ',0.25); --accent-alpha15: rgba(' + r + ',' + g + ',' + b + ',0.15); --accent-alpha10: rgba(' + r + ',' + g + ',' + b + ',0.1); }';
                document.head.appendChild(style);
            } catch (e) {}
        })();

        (function loadSiteName() {
            fetch(API_BASE + '/system/config')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.code === 200 && data.data.site_name) {
                        var name = data.data.site_name;
                        document.title = document.title.replace(/校园图书馆/g, name);
                        var els = document.querySelectorAll('.site-name');
                        for (var i = 0; i < els.length; i++) {
                            els[i].textContent = name;
                            els[i].style.visibility = 'visible';
                        }
                    } else {
                        var els = document.querySelectorAll('.site-name');
                        for (var i = 0; i < els.length; i++) els[i].style.visibility = 'visible';
                    }
                }).catch(function () {
                    var els = document.querySelectorAll('.site-name');
                    for (var i = 0; i < els.length; i++) els[i].style.visibility = 'visible';
                });
        })();

        function getSavedUser() { try { return JSON.parse(localStorage.getItem('library_user') || 'null'); } catch { return null; } }
        function saveToken(t) { localStorage.setItem('library_token', t); }
        function saveUser(u) { localStorage.setItem('library_user', JSON.stringify(u)); }

        function showToast(msg, type) {
            const container = document.getElementById('toast-container');
            const id = 't' + Date.now();
            const bg = type === 'error' ? 'bg-danger' : 'bg-success';
            container.insertAdjacentHTML('beforeend',
                '<div id="' + id + '" class="toast align-items-center text-white ' + bg + ' border-0" role="alert"><div class="d-flex"><div class="toast-body">' + msg + '</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>');
            const el = document.getElementById(id);
            new bootstrap.Toast(el, { delay: 3000 }).show();
            el.addEventListener('hidden.bs.toast', () => el.remove());
        }

        (function () {
            const user = getSavedUser();
            if (user && (user.role === 2 || user.role === 3)) {
                window.location.href = 'index.html';
                return;
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>登录中...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const resp = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await resp.json();

                if (data.code !== 200) {
                    showToast(data.message || '登录失败', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>登 录';
                    return;
                }

                const userData = data.data.user;
                if (userData.role !== 2 && userData.role !== 3) {
                    showToast('仅限管理员登录', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>登 录';
                    return;
                }

                saveToken(data.data.token);
                saveUser(userData);
                window.location.href = 'index.html';
            } catch (err) {
                showToast('网络错误，请重试', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>登 录';
            }
        });
    </script>
</body>
</html>
