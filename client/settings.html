<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个性化设置 - 校园图书馆</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #2E3134 url('img/bg.png') center/cover fixed no-repeat; background-blend-mode: overlay; min-height: 100vh; }
        .navbar-brand { font-weight: 700; color: var(--accent) !important; }
        .navbar-brand i.bi-book { color: var(--accent); }
        .navbar { background: #24272a !important; border-bottom: 1px solid #4a5056; }
        .credit-badge { font-size: 0.85rem; }
        .main-content { padding-top: 80px; padding-bottom: 40px; }
        .color-pick { width: 40px; height: 40px; border-radius: 8px; cursor: pointer; border: 3px solid transparent; transition: all .15s; }
        .color-pick.active { border-color: #fff; transform: scale(1.1); }
        .card { background: #363b3f; border-color: #4a5056; }
        .card-body { color: #e0e0e0; }
        h4, h6 { color: #e0e0e0; }
        .text-muted { color: #888 !important; }
        .form-control { background: #24272a; border-color: #4a5056; color: #e0e0e0; }
        .form-control:focus { background: #363b3f; border-color: var(--accent); color: #e0e0e0; }
        .form-check-label { color: #bbb; }
        .btn-primary { background: var(--accent); border-color: var(--accent); }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .btn-outline-secondary { color: #bbb; border-color: #4a5056; }
        .btn-outline-secondary:hover { background: #3e4347; border-color: #5a6066; color: #e0e0e0; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-book me-2"></i><span class="site-name">校园图书馆</span></a>
            <div class="d-flex align-items-center gap-3">
                <span id="creditDisplay" class="badge credit-badge"></span>
                <span id="userDisplay" class="text-white"></span>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <a href="index.html" class="btn btn-outline-secondary mb-3"><i class="bi bi-arrow-left"></i> 返回</a>
            <h4 class="mb-4"><i class="bi bi-sliders me-2"></i>个性化设置</h4>

            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h6><i class="bi bi-palette me-2"></i>主题颜色</h6>
                    <div class="d-flex gap-2 flex-wrap" id="colorPicker">
                        <div class="color-pick" style="background:#0d6efd" data-color="#0d6efd" title="蓝色"></div>
                        <div class="color-pick" style="background:#198754" data-color="#198754" title="绿色"></div>
                        <div class="color-pick" style="background:#dc3545" data-color="#dc3545" title="红色"></div>
                        <div class="color-pick" style="background:#6f42c1" data-color="#6f42c1" title="紫色"></div>
                        <div class="color-pick" style="background:#fd7e14" data-color="#fd7e14" title="橙色"></div>
                        <div class="color-pick" style="background:#20c997" data-color="#20c997" title="青色"></div>
                    </div>
                    <button id="saveColorBtn" class="btn btn-primary btn-sm mt-3">保存颜色</button>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h6><i class="bi bi-image me-2"></i>自定义背景</h6>
                    <input type="file" id="bgUpload" class="form-control mb-2" accept="image/png,image/jpeg,image/gif,image/webp">
                    <small class="text-muted">上传后需管理员审核通过方可显示</small>
                    <br><button id="uploadBgBtn" class="btn btn-primary btn-sm mt-2">上传背景</button>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h6><i class="bi bi-book-half me-2"></i>学习触发模式</h6>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="learnMode">
                        <label class="form-check-label" for="learnMode">还书后自动弹出答题（默认主动进入）</label>
                    </div>
                    <button id="saveModeBtn" class="btn btn-primary btn-sm mt-2">保存设置</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        (function () {
            const user = checkAuthAndRedirect();
            if (!user) return;

            document.getElementById('userDisplay').textContent = user.username;
            const cb = document.getElementById('creditDisplay');
            const cs = user.credit_score;
            let cc = cs <= 2 ? 'bg-danger' : cs <= 4 ? 'bg-warning text-dark' : 'bg-success';
            cb.className = 'badge ' + cc + ' credit-badge';
            cb.textContent = '信誉分: ' + cs;

            let currentColor = '#0d6efd';

            async function loadSettings() {
                const r = await apiGet('/user/settings');
                if (r && r.code === 200) {
                    const s = r.data;
                    currentColor = s.theme_color || '#0d6efd';
                    document.getElementById('learnMode').checked = s.learning_trigger_mode === '自动';
                    document.querySelectorAll('.color-pick').forEach(el => {
                        el.classList.toggle('active', el.dataset.color === currentColor);
                    });
                }
            }

            document.querySelectorAll('.color-pick').forEach(el => {
                el.addEventListener('click', function () {
                    document.querySelectorAll('.color-pick').forEach(x => x.classList.remove('active'));
                    this.classList.add('active');
                    currentColor = this.dataset.color;
                });
            });

            document.getElementById('saveColorBtn').addEventListener('click', async function () {
                this.disabled = true;
                const r = await apiPost('/user/settings', { theme_color: currentColor });
                this.disabled = false;
                if (r && r.code === 200) {
                    applyAccentColor(currentColor);
                    showToast('颜色已保存', 'success');
                } else { showToast('保存失败', 'error'); }
            });

            document.getElementById('uploadBgBtn').addEventListener('click', async function () {
                const file = document.getElementById('bgUpload').files[0];
                if (!file) { showToast('请选择图片', 'warning'); return; }
                if (file.size > 10 * 1024 * 1024) { showToast('图片不能超过10MB', 'error'); return; }
                this.disabled = true;
                const fd = new FormData();
                fd.append('background_image', file);
                const resp = await fetch(API_BASE + '/user/settings', {
                    method: 'POST', headers: { 'Authorization': 'Bearer ' + getToken() }, body: fd
                });
                const r = await resp.json();
                this.disabled = false;
                if (r && r.code === 200) { showToast('背景已上传，等待审核', 'success'); } else { showToast(r?.message || '上传失败', 'error'); }
            });

            document.getElementById('saveModeBtn').addEventListener('click', async function () {
                this.disabled = true;
                const mode = document.getElementById('learnMode').checked ? '自动' : '主动';
                const r = await apiPost('/user/settings', { learning_trigger_mode: mode });
                this.disabled = false;
                if (r && r.code === 200) { showToast('设置已保存', 'success'); } else { showToast('保存失败', 'error'); }
            });

            loadSettings();
        })();
    </script>
    <script src="js/live2d-widget.js"></script>
</body>
</html>
