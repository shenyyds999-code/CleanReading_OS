<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的借阅 - 校园图书馆</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #2E3134 url('img/bg.png') center/cover fixed no-repeat; background-blend-mode: overlay; min-height: 100vh; }
        .navbar-brand { font-weight: 700; color: var(--accent) !important; }
        .navbar-brand i.bi-book { color: var(--accent); }
        .navbar { background: #24272a !important; border-bottom: 1px solid #4a5056; }
        .credit-badge { font-size: 0.85rem; }
        .main-content { padding-top: 80px; padding-bottom: 40px; }
        .return-preview { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; cursor: pointer; }
        .preview-remove { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 50%; background: #dc3545; color: #fff; font-size: 12px; line-height: 20px; text-align: center; cursor: pointer; }
        .table { color: #e0e0e0; background: #363b3f; border-radius: 8px; overflow: hidden; }
        .table th { background: #24272a; color: #bbb; border-color: #4a5056; }
        .table td { background: #363b3f; color: #e0e0e0; border-color: #4a5056; }
        .table-hover tbody tr:hover { background: #3e4347; }
        h4 { color: #e0e0e0; }
        .text-muted { color: #888 !important; }
        .btn-primary { background: var(--accent); border-color: var(--accent); }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .btn-outline-warning { color: #f0a040; border-color: #f0a040; }
        .btn-outline-warning:hover { background: #f0a040; color: #2E3134; }
        .form-control { background: #24272a; border-color: #4a5056; color: #e0e0e0; }
        .form-control:focus { background: #363b3f; border-color: var(--accent); color: #e0e0e0; }
        .modal-content { background: #363b3f; border-color: #4a5056; color: #e0e0e0; }
        .modal-header, .modal-footer { border-color: #4a5056; }
        .badge.bg-success { background: #1a3a2a !important; color: #4ade80; }
        .badge.bg-primary { background: #1a2a3a !important; color: #7eb8ff; }
        .badge.bg-warning { background: #3a3010 !important; color: #f0a040; }
        .badge.bg-danger { background: #3a1a1a !important; color: #f87171; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-book me-2"></i><span class="site-name">校园图书馆</span></a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house"></i> 首页</a></li>
                    <li class="nav-item"><a class="nav-link active" href="mine.html"><i class="bi bi-person"></i> 我的借阅</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a class="text-white position-relative" href="notifications.html" id="notifyBell" title="通知">
                        <i class="bi bi-bell fs-5"></i>
                        <span id="notifyBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size:0.6rem;"></span>
                    </a>
                    <a class="text-white" href="settings.html" title="设置"><i class="bi bi-gear fs-5"></i></a>
                    <span id="creditDisplay" class="badge credit-badge"></span>
                    <span id="userDisplay" class="text-white"></span>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <h4 class="mb-4"><i class="bi bi-journal-bookmark me-2"></i>我的借阅记录</h4>

            <div id="loadingArea" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2">加载中...</p>
            </div>

            <div id="emptyArea" class="text-center py-5 d-none">
                <i class="bi bi-inbox text-muted" style="font-size: 3rem;"></i>
                <p class="text-muted mt-2">暂无借阅记录</p>
            </div>

            <div id="recordList" class="d-none">
                <div class="table-responsive">
                    <table class="table table-hover align-middle shadow-sm rounded" style="background:#363b3f;">
                        <thead style="background:#24272a;color:#bbb;">
                            <tr>
                                <th>图书</th>
                                <th>借阅日期</th>
                                <th>应还日期</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="recordTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="returnModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">提交归还</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small">请上传图书当前状况照片（最多3张）</p>
                    <input type="file" id="returnImages" class="form-control" accept="image/png,image/jpeg,image/gif,image/webp" multiple>
                    <div id="imagePreview" class="d-flex flex-wrap gap-2 mt-3"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="submitReturnBtn" disabled>提交</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        (function () {
            const user = checkAuthAndRedirect();
            if (!user) return;

            document.getElementById('userDisplay').textContent = user.username;
            const creditBadge = document.getElementById('creditDisplay');
            const cs = user.credit_score;
            let cc = 'bg-success';
            if (cs <= 2) cc = 'bg-danger';
            else if (cs <= 4) cc = 'bg-warning text-dark';
            creditBadge.className = 'badge ' + cc + ' credit-badge';
            creditBadge.textContent = '信誉分: ' + cs;

            let selectedFiles = [];
            let currentRecordId = null;

            async function loadRecords() {
                const result = await apiGet('/return/my?per_page=50');
                document.getElementById('loadingArea').classList.add('d-none');

                if (!result || result.code !== 200) {
                    showToast('加载失败', 'error');
                    return;
                }

                const items = result.data.items || [];
                if (items.length === 0) {
                    document.getElementById('emptyArea').classList.remove('d-none');
                    return;
                }

                document.getElementById('recordList').classList.remove('d-none');
                const tbody = document.getElementById('recordTableBody');
                tbody.innerHTML = '';

                items.forEach(r => {
                    const row = document.createElement('tr');
                    const statusMap = {
                        '借阅中': '<span class="badge bg-primary">借阅中</span>',
                        '已提交归还': '<span class="badge bg-warning text-dark">待确认</span>',
                        '已归还': '<span class="badge bg-success">已归还</span>',
                        '污损扣分中': '<span class="badge bg-danger">污损处理中</span>'
                    };
                    const statusHtml = statusMap[r.status] || r.status;

                    let actionHtml = '';
                    if (r.status === '借阅中') {
                        actionHtml = '<button class="btn btn-outline-warning btn-sm return-btn" data-id="' + r.id + '" data-title="' + escapeHtml(r.book_title) + '"><i class="bi bi-arrow-return-left"></i> 还书</button>';
                    } else if (r.status === '已提交归还') {
                        actionHtml = '<span class="text-muted small">等待管理员确认</span>';
                    } else {
                        actionHtml = '-';
                    }

                    row.innerHTML = `
                        <td><strong>${escapeHtml(r.book_title)}</strong></td>
                        <td><small>${r.borrow_date}</small></td>
                        <td><small>${r.due_date}</small></td>
                        <td>${statusHtml}</td>
                        <td>${actionHtml}</td>`;
                    tbody.appendChild(row);
                });

                document.querySelectorAll('.return-btn').forEach(btn => {
                    btn.addEventListener('click', function () {
                        currentRecordId = this.dataset.id;
                        selectedFiles = [];
                        document.getElementById('imagePreview').innerHTML = '';
                        document.getElementById('returnImages').value = '';
                        document.getElementById('submitReturnBtn').disabled = true;
                        const modal = new bootstrap.Modal(document.getElementById('returnModal'));
                        modal.show();
                    });
                });
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            document.getElementById('returnImages').addEventListener('change', function () {
                const files = Array.from(this.files);
                selectedFiles = files;
                const preview = document.getElementById('imagePreview');
                preview.innerHTML = '';

                files.forEach((f, idx) => {
                    if (f.size > 10 * 1024 * 1024) {
                        showToast('图片 ' + f.name + ' 超过10MB', 'error');
                        return;
                    }
                    const url = URL.createObjectURL(f);
                    const wrapper = document.createElement('div');
                    wrapper.className = 'position-relative d-inline-block';
                    wrapper.innerHTML = `
                        <img src="${url}" class="return-preview">
                        <span class="preview-remove" data-idx="${idx}">&times;</span>`;
                    preview.appendChild(wrapper);
                });

                document.getElementById('submitReturnBtn').disabled = files.length === 0;

                preview.querySelectorAll('.preview-remove').forEach(el => {
                    el.addEventListener('click', function () {
                        const idx = parseInt(this.dataset.idx);
                        selectedFiles.splice(idx, 1);
                        this.parentElement.remove();
                        document.getElementById('submitReturnBtn').disabled = selectedFiles.length === 0;
                    });
                });
            });

            document.getElementById('submitReturnBtn').addEventListener('click', async function () {
                if (!currentRecordId || selectedFiles.length === 0) {
                    showToast('请选择至少一张照片', 'warning');
                    return;
                }

                this.disabled = true;
                this.textContent = '提交中...';

                const formData = new FormData();
                formData.append('record_id', currentRecordId);
                selectedFiles.forEach(f => formData.append('images', f));

                const response = await fetch(API_BASE + '/return/submit', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + getToken() },
                    body: formData
                });
                const result = await response.json();

                this.disabled = false;
                this.textContent = '提交';

                if (result.code !== 200) {
                    showToast(result.message || '提交失败', 'error');
                    return;
                }

                bootstrap.Modal.getInstance(document.getElementById('returnModal')).hide();
                showToast('还书申请已提交！', 'success');
                loadRecords();
            });

            loadRecords();
        })();
    </script>
    <script src="js/live2d-widget.js"></script>
</body>
</html>
