<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书详情 - 校园图书馆</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(rgba(250,251,254,0.9), rgba(250,251,254,0.9)), url('img/bg.png') center/cover fixed no-repeat; min-height: 100vh; color: #1b1622; }
        .navbar-brand { font-weight: 700; color: var(--accent) !important; }
        .navbar-brand i.bi-book { color: var(--accent); }
        .navbar { background: #ffffff !important; border-bottom: 1px solid #dfe2ea; }
        .navbar .nav-link { color: #5f5a66; }
        .credit-badge { font-size: 0.85rem; }
        .main-content { padding-top: 80px; padding-bottom: 40px; }
        .book-cover-lg { width: 100%; height: 350px; object-fit: cover; background: #eef0f6; display: flex; align-items: center; justify-content: center; font-size: 5rem; color: #b9b6c4; border-radius: 0; overflow: hidden; }
        .comment-avatar { width: 40px; height: 40px; border-radius: 0; background: #e8eaf0; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #8c8896; }
        .comment-item { border-bottom: 1px solid #e6e8ef; padding: 16px 0; color: #4a4553; }
        .comment-item strong { color: #1b1622; }
        .comment-item p { color: #5f5a66; }
        .card { background: #ffffff; border-color: #dfe2ea; }
        .card-body { color: #1b1622; }
        .card-footer { background: #f7f8fb; border-color: #dfe2ea; }
        .card-header { background: #f7f8fb; border-color: #dfe2ea; }
        .table { color: #1b1622; background-color: transparent; }
        .table td { color: #1b1622; background-color: transparent; }
        .table .text-muted { color: #6c757d !important; }
        .text-muted { color: #6c757d !important; }
        h2, h5 { color: #1b1622; }
        .form-control, textarea { background: #ffffff; border-color: #d5d9e3; color: #1b1622; }
        .form-control:focus, textarea:focus { background: #ffffff; border-color: var(--accent); color: #1b1622; box-shadow: 0 0 0 0.2rem var(--accent-alpha25); }
        .btn-primary { background: var(--accent); border-color: var(--accent); }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .btn-outline-secondary { color: #5f5a66; border-color: #d5d9e3; }
        .btn-outline-secondary:hover { background: #eef0f6; border-color: #c7cbd8; color: #1b1622; }
        .btn-outline-info { color: #1f5fa8; border-color: #1f5fa8; }
        .btn-outline-info:hover { background: #1f5fa8; color: #fff; }
        .card-header.bg-info { background: var(--accent) !important; }
        .modal-content { background: #ffffff; border-color: #dfe2ea; color: #1b1622; }
        .modal-header { border-color: #dfe2ea; }
        .modal-footer { border-color: #dfe2ea; }
        .badge.bg-success { background: #e5f4ea !important; color: #1f7a45; }
        .badge.bg-secondary { background: #e9ebf1 !important; color: #5f5a66; }
        .badge.bg-info { background: #e8f0fa !important; color: #1f5fa8; }
        .btn.btn-secondary { background: #e9ebf1; border-color: #d5d9e3; color: #4a4553; }
        .btn.btn-secondary:hover { background: #dde0e8; border-color: #c7cbd8; color: #1b1622; }
        hr { border-color: #dfe2ea; }
    
        /* Cathay-style square corners */
        .form-control, .form-select, .input-group-text, .btn, .card, .modal-content, .modal-header, .modal-footer, .dropdown-menu, .badge, .alert, .toast, .nav-pills .nav-link, .pagination .page-link, .list-group-item, .navbar-toggler, .form-check-input, .rounded, .rounded-1, .rounded-2, .rounded-3, .rounded-circle, .rounded-pill { border-radius: 0 !important; }
        .navbar { box-shadow: none !important; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <nav class="navbar navbar-expand-lg navbar-light fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-book me-2"></i><span class="site-name">校园图书馆</span></a>
            <div class="d-flex align-items-center gap-3">
                <a class="text-body" href="javascript:history.back()" title="返回"><i class="bi bi-arrow-left fs-5"></i></a>
                <span id="creditDisplay" class="badge credit-badge"></span>
                <span id="userDisplay" class="text-body"></span>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <div id="loadingArea" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2">加载中...</p>
            </div>

            <div id="detailArea" class="d-none">
                <a href="index.html" class="btn btn-outline-secondary mb-3"><i class="bi bi-arrow-left"></i> 返回</a>
                <div class="row">
                    <div class="col-md-4 mb-4">
                        <div id="bookCover" class="book-cover-lg shadow-sm"><i class="bi bi-book"></i></div>
                    </div>
                    <div class="col-md-8">
                        <h2 id="bookTitle"></h2>
                        <div class="mb-3"><span id="bookStatus" class="badge fs-6"></span></div>
                        <table class="table table-borderless">
                            <tr><td style="width:80px;color:#5f5a66;">作者</td><td id="bookAuthor"></td></tr>
                            <tr><td style="color:#5f5a66;">ISBN</td><td id="bookIsbn"></td></tr>
                            <tr><td style="color:#5f5a66;">分类</td><td id="bookCategory"></td></tr>
                            <tr><td style="color:#5f5a66;">出版社</td><td id="bookPublisher"></td></tr>
                            <tr><td style="color:#5f5a66;">位置</td><td id="bookLocation"></td></tr>
                            <tr><td style="color:#5f5a66;">馆藏</td><td id="bookCopies"></td></tr>
                        </table>
                        <p id="bookDesc" style="color:#5f5a66;"></p>
                        <div id="ratingArea" class="mb-3">
                            <span class="text-muted me-2">我的评分：</span>
                            <div class="rating-stars d-inline-flex" role="group" aria-label="评分">
                                <button class="btn btn-link text-muted p-0 me-1 rating-star" data-rating="1"><i class="bi bi-star fs-5"></i></button>
                                <button class="btn btn-link text-muted p-0 me-1 rating-star" data-rating="2"><i class="bi bi-star fs-5"></i></button>
                                <button class="btn btn-link text-muted p-0 me-1 rating-star" data-rating="3"><i class="bi bi-star fs-5"></i></button>
                                <button class="btn btn-link text-muted p-0 me-1 rating-star" data-rating="4"><i class="bi bi-star fs-5"></i></button>
                                <button class="btn btn-link text-muted p-0 me-1 rating-star" data-rating="5"><i class="bi bi-star fs-5"></i></button>
                            </div>
                            <span id="avgRatingText" class="text-muted ms-2"></span>
                        </div>
                        <div class="mt-3">
                            <button id="borrowBtn" class="btn btn-primary btn-lg px-4" disabled>借 阅</button>
                            <span id="borrowInfo" class="text-muted ms-3"></span>
                            <button class="btn btn-outline-info ms-2" id="quizBtn" onclick="window.location.href='learn.html?book_id='+bookId"><i class="bi bi-pencil-square"></i> 答题闯关</button>
                        </div>
                    </div>
                </div>

                <hr class="my-4">
                <h5 class="mb-3"><i class="bi bi-chat-dots me-2"></i>评论区</h5>
                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <textarea id="commentInput" class="form-control mb-2" rows="3" placeholder="写下你的评论...（敏感词将被拦截）" maxlength="2000"></textarea>
                        <button id="commentBtn" class="btn btn-primary btn-sm">发表评论</button>
                        <small class="text-muted ms-2" id="commentCount">0</small>
                    </div>
                </div>
                <div class="card shadow-sm">
                    <div class="card-body" id="commentList"></div>
                </div>

                <hr class="my-4" id="recommendDivider" style="display:none;">
                <h5 class="mb-3" id="recommendTitle" style="display:none;"><i class="bi bi-exclamation-circle me-2"></i>你可能错过了</h5>
                <div id="recommendBooks" class="row g-3" style="display:none;"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">确认借阅</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <p>确认借阅 <strong id="confirmBookTitle"></strong>？</p>
                    <p class="text-muted small">应还日期：<span id="confirmDueDate"></span>（<span id="confirmDays"></span>天）</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="confirmBorrowBtn">确认借阅</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js?v=046"></script>
    <script>
        (async function () {
            const user = await checkAuthAndRedirect();
            if (!user) return;

            const params = new URLSearchParams(window.location.search);
            const bkId = params.get('id');
            if (!bkId) { window.location.href = 'index.html'; return; }
            window.bookId = bkId;

            document.getElementById('userDisplay').textContent = user.username;
            const cb = document.getElementById('creditDisplay');
            const cs = user.credit_score;
            let cc = cs <= 2 ? 'bg-danger' : cs <= 4 ? 'bg-warning text-dark' : 'bg-success';
            cb.className = 'badge ' + cc + ' credit-badge';
            cb.textContent = '信誉分: ' + cs;

            let bookData = null;

            function escHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

            async function loadBook() {
                try {
                    console.log('[loadBook] 开始加载图书信息, book_id:', bkId);
                    const r = await apiGet('/books/' + bkId);
                    console.log('[loadBook] API 返回:', r);
                    document.getElementById('loadingArea').classList.add('d-none');
                    if (!r || r.code !== 200) { showToast('图书不存在', 'error'); return; }

                    bookData = r.data;
                    document.getElementById('detailArea').classList.remove('d-none');

                    const cover = document.getElementById('bookCover');
                    cover.innerHTML = bookData.cover_image_url
                        ? '<img src="' + bookData.cover_image_url + '" class="w-100 h-100" style="object-fit:cover;" onerror="this.style.display=\'none\'">'
                        : '<i class="bi bi-book"></i>';

                    document.getElementById('bookTitle').textContent = bookData.title;
                    document.getElementById('bookAuthor').textContent = bookData.author;
                    document.getElementById('bookIsbn').textContent = bookData.isbn;
                    document.getElementById('bookCategory').textContent = bookData.category || '-';
                    document.getElementById('bookPublisher').textContent = bookData.publisher || '-';
                    document.getElementById('bookLocation').textContent = bookData.location || '-';
                    document.getElementById('bookCopies').textContent = bookData.available_copies + ' / ' + bookData.total_copies;
                    document.getElementById('bookDesc').textContent = bookData.description || '暂无简介';

                    const sb = document.getElementById('bookStatus');
                    sb.className = 'badge fs-6 ' + (bookData.can_borrow ? 'bg-success' : 'bg-secondary');
                    sb.textContent = bookData.can_borrow ? '可借' : (bookData.available_copies > 0 ? bookData.status : '已借完');

                    const bb = document.getElementById('borrowBtn');
                    bb.disabled = true;
                    bb.textContent = '检查中...';
                    console.log('[loadBook] 开始检查借阅状态');

                    try {
                        const statusCheck = await apiGet('/borrow/status?book_id=' + bkId);
                        console.log('[loadBook] 借阅状态 API 返回:', statusCheck);
                        if (statusCheck && statusCheck.code === 200 && statusCheck.data.borrowed) {
                            bb.textContent = '已借阅';
                            document.getElementById('borrowInfo').textContent = '请先归还后再借';
                            return;
                        }
                    } catch (e) {
                        console.error('[loadBook] 检查借阅状态失败:', e);
                    }

                    console.log('[loadBook] can_borrow:', bookData.can_borrow, 'credit_score:', cs);
                    if (bookData.can_borrow && cs >= 3) {
                        bb.disabled = false;
                        bb.textContent = '借 阅';
                        const days = cs >= 5 ? 31 : 15;
                        document.getElementById('borrowInfo').textContent = '借阅 ' + days + ' 天';
                        console.log('[loadBook] 按钮已启用');
                    } else if (cs < 3) {
                        bb.textContent = '信誉分不足';
                    } else {
                        bb.textContent = '不可借';
                    }
                } catch (e) {
                    console.error('[loadBook] 加载图书信息失败:', e);
                    document.getElementById('loadingArea').classList.add('d-none');
                    showToast('加载图书信息失败', 'error');
                }
            }

            document.getElementById('borrowBtn').addEventListener('click', function () {
                if (!bookData) return;
                const days = user.credit_score >= 5 ? 31 : 15;
                const dd = new Date(); dd.setDate(dd.getDate() + days);
                document.getElementById('confirmBookTitle').textContent = bookData.title;
                document.getElementById('confirmDueDate').textContent = dd.toISOString().slice(0,10);
                document.getElementById('confirmDays').textContent = days;
                new bootstrap.Modal(document.getElementById('confirmModal')).show();
            });

            document.getElementById('confirmBorrowBtn').addEventListener('click', async function () {
                this.disabled = true;
                const r = await apiPost('/borrow/request', { book_id: parseInt(bkId) });
                bootstrap.Modal.getInstance(document.getElementById('confirmModal')).hide();
                this.disabled = false;
                if (!r || r.code !== 200) { showToast(r?.message || '借书失败', 'error'); return; }
                showToast('借阅成功！应还：' + r.data.due_date, 'success');
                document.getElementById('borrowBtn').disabled = true;
                document.getElementById('borrowBtn').textContent = '已借阅';
                const refresh = await apiGet('/auth/me');
                if (refresh && refresh.code === 200) saveUser(refresh.data);
            });

            async function loadComments() {
                const r = await apiGet('/comments?book_id=' + bkId + '&per_page=50');
                const container = document.getElementById('commentList');
                document.getElementById('commentCount').textContent = r?.data?.total || 0;
                if (!r || !r.data || !r.data.items.length) {
                    container.innerHTML = '<p class="text-muted text-center py-3">暂无评论，来发表第一条吧</p>';
                    return;
                }
                container.innerHTML = r.data.items.map(c => `
                    <div class="comment-item">
                        <div class="d-flex align-items-start gap-2">
                            <div class="comment-avatar"><i class="bi bi-person"></i></div>
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between">
                                    <strong class="small">${escHtml(c.username)}</strong>
                                    <small class="text-muted">${c.created_at}</small>
                                </div>
                                <p class="mb-1 mt-1">${escHtml(c.content)}</p>
                                <div class="d-flex gap-3">
                                    <a href="#" class="text-decoration-none small like-btn${c.is_liked ? ' text-primary' : ''}" data-id="${c.id}"><i class="bi ${c.is_liked ? 'bi-hand-thumbs-up-fill' : 'bi-hand-thumbs-up'}"></i> <span class="like-count">${c.like_count}</span></a>
                                    ${c.user_id === user.id
                                        ? '<a href="#" class="text-decoration-none small text-danger delete-comment-btn" data-id="' + c.id + '"><i class="bi bi-trash"></i> 删除</a>'
                                        : '<a href="#" class="text-decoration-none small text-danger report-btn" data-id="' + c.id + '"><i class="bi bi-flag"></i> 举报</a>'}
                                </div>
                            </div>
                        </div>
                    </div>`).join('');

                container.querySelectorAll('.like-btn').forEach(b => b.addEventListener('click', async function (e) {
                    e.preventDefault();
                    const id = this.dataset.id;
                    const r = await apiPost('/comments/' + id + '/like', {});
                    if (r && r.code === 200) {
                        const countSpan = this.querySelector('.like-count');
                        const icon = this.querySelector('i');
                        if (r.data.is_liked) {
                            this.classList.add('text-primary');
                            icon.className = 'bi bi-hand-thumbs-up-fill';
                        } else {
                            this.classList.remove('text-primary');
                            icon.className = 'bi bi-hand-thumbs-up';
                        }
                        if (countSpan) countSpan.textContent = r.data.like_count;
                    }
                }));

                container.querySelectorAll('.report-btn').forEach(b => b.addEventListener('click', async function (e) {
                    e.preventDefault();
                    if (!confirm('确认举报该评论？')) return;
                    const r = await apiPost('/comments/' + this.dataset.id + '/report', {});
                    if (r && r.code === 200) { this.textContent = '已举报'; this.classList.add('text-muted'); }
                }));

                container.querySelectorAll('.delete-comment-btn').forEach(b => b.addEventListener('click', async function (e) {
                    e.preventDefault();
                    if (!confirm('确认删除该评论？')) return;
                    const resp = await fetch(API_BASE + '/comments/' + this.dataset.id, {
                        method: 'DELETE',
                        headers: getDefaultHeaders()
                    });
                    const r = await resp.json();
                    if (r && r.code === 200) {
                        this.closest('.comment-item').remove();
                        showToast('评论已删除', 'success');
                    } else {
                        showToast(r?.message || '删除失败', 'error');
                    }
                }));
            }

            document.getElementById('commentBtn').addEventListener('click', async function () {
                const content = document.getElementById('commentInput').value.trim();
                if (!content) { showToast('请输入评论内容', 'warning'); return; }
                this.disabled = true;
                const r = await apiPost('/comments', { book_id: parseInt(bkId), content: content });
                this.disabled = false;
                if (!r || r.code !== 200) { showToast(r?.message || '发表失败', 'error'); return; }
                document.getElementById('commentInput').value = '';
                showToast('评论发表成功！', 'success');
                loadComments();
            });

            function escHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

            loadBook();
            loadComments();
            loadRecommendations();

            document.querySelectorAll('.rating-star').forEach(btn => {
                btn.addEventListener('click', async function () {
                    const rating = parseInt(this.dataset.rating);
                    const r = await apiPost('/books/' + bkId + '/rating', { rating: rating });
                    if (r && r.code === 200) {
                        updateRatingStars(rating);
                        document.getElementById('avgRatingText').textContent = '平均 ' + r.data.avg_rating + ' 分';
                        showToast('评分成功', 'success');
                    } else {
                        showToast(r?.message || '评分失败', 'error');
                    }
                });
            });

            function updateRatingStars(rating) {
                document.querySelectorAll('.rating-star').forEach(btn => {
                    const starRating = parseInt(btn.dataset.rating);
                    const icon = btn.querySelector('i');
                    if (starRating <= rating) {
                        btn.classList.remove('text-muted');
                        btn.classList.add('text-warning');
                        icon.className = 'bi bi-star-fill fs-5';
                    } else {
                        btn.classList.add('text-muted');
                        btn.classList.remove('text-warning');
                        icon.className = 'bi bi-star fs-5';
                    }
                });
            }

            async function loadRecommendations() {
                const r = await apiGet('/books/' + bkId + '/recommendations');
                if (r && r.data && r.data.items && r.data.items.length > 0) {
                    document.getElementById('recommendDivider').style.display = '';
                    document.getElementById('recommendTitle').style.display = '';
                    const container = document.getElementById('recommendBooks');
                    container.style.display = '';
                    container.innerHTML = r.data.items.map(b => `
                        <div class="col-6 col-md-3">
                            <div class="card h-100 shadow-sm" onclick="window.location.href='book.html?id=${b.id}'" style="cursor:pointer;">
                                <div style="height:180px;overflow:hidden;background:#eef0f6;">
                                    <img src="${b.cover_image_url || b.openlibrary_cover || ''}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
                                </div>
                                <div class="card-body p-2">
                                    <p class="small fw-bold text-body mb-1" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(b.title)}</p>
                                    <p class="text-muted small mb-0" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(b.author)}</p>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            }

            if (bookData) {
                const avgText = document.getElementById('avgRatingText');
                if (bookData.avg_rating && bookData.avg_rating > 0) {
                    avgText.textContent = '平均 ' + bookData.avg_rating + ' 分';
                } else {
                    avgText.textContent = '暂无评分';
                }
                if (bookData.user_rating) {
                    updateRatingStars(bookData.user_rating);
                }
            }
        })();
    </script>
    <script src="js/live2d-widget.js"></script>
</body>
</html>
