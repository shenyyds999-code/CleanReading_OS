<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园图书馆借阅系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #2E3134 url('img/bg.png') center/cover fixed no-repeat; background-blend-mode: overlay; min-height: 100vh; }
        .navbar-brand { font-weight: 700; color: #FF6699 !important; }
        .navbar-brand i.bi-book { color: #FF6699; }
        .navbar { background: #24272a !important; border-bottom: 1px solid #4a5056; }
        .credit-badge { font-size: 0.85rem; }
        .main-content { padding-top: 80px; padding-bottom: 40px; }
        .search-bar { max-width: 600px; margin: 0 auto; }
        .search-bar input, .search-bar select { background: #24272a; border-color: #4a5056; color: #e0e0e0; }
        .search-bar input:focus, .search-bar select:focus { background: #363b3f; border-color: #FF6699; color: #e0e0e0; }
        .search-bar .input-group-text { background: #363b3f; border-color: #4a5056; color: #888; }
        .book-card { transition: transform .15s; cursor: pointer; background: #363b3f; border-color: #4a5056; }
        .book-card:hover { transform: translateY(-2px); border-color: #FF6699; }
        .book-card .card-body { color: #e0e0e0; }
        .book-card .card-text { color: #999; }
        .book-cover { height: 200px; object-fit: cover; background: #24272a; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #555; }
        .status-badge { font-size: 0.75rem; }
        .blocked-card { max-width: 500px; }
        .text-muted { color: #888 !important; }
        .btn-primary { background: #FF6699; border-color: #FF6699; }
        .btn-primary:hover { background: #e05580; border-color: #e05580; }
        .btn-outline-light { border-color: #FF6699; color: #FF6699; }
        .btn-outline-light:hover { background: #FF6699; border-color: #FF6699; color: #fff; }
        #welcomeArea i.bi { color: #FF6699 !important; }
        #welcomeArea h2 { color: #e0e0e0; }
        #welcomeArea p { color: #888; }
        .badge.bg-success { background: #1a3a2a !important; color: #4ade80; }
        .badge.bg-secondary { background: #4a5056 !important; color: #ccc; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-book me-2"></i>校园图书馆
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html"><i class="bi bi-house"></i> 首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="mine.html"><i class="bi bi-person"></i> 我的借阅</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a class="text-white position-relative" href="#" id="notifyBell" title="通知">
                        <i class="bi bi-bell fs-5"></i>
                        <span id="notifyBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size:0.6rem;"></span>
                    </a>
                    <a class="text-white" href="settings.html" title="设置"><i class="bi bi-gear fs-5"></i></a>
                    <span id="creditDisplay" class="badge credit-badge"></span>
                    <span id="userDisplay" class="text-white"></span>
                    <button id="logoutBtn" class="btn btn-outline-light btn-sm">退出</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="search-bar mb-4">
                <div class="input-group input-group-lg shadow-sm">
                    <span class="input-group-text border-end-0" style="background:#24272a;border-color:#4a5056;color:#888;"><i class="bi bi-search"></i></span>
                    <input type="text" id="searchInput" class="form-control border-start-0" placeholder="搜索图书名称、作者、ISBN..." style="background:#24272a;border-color:#4a5056;color:#e0e0e0;">
                    <select id="searchType" class="form-select" style="max-width:100px;background:#24272a;border-color:#4a5056;color:#e0e0e0;">
                        <option value="fuzzy">模糊</option>
                        <option value="exact">精确</option>
                    </select>
                    <button id="searchBtn" class="btn btn-primary">搜索</button>
                </div>
            </div>

            <div id="loadingArea" class="text-center py-5 d-none">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="text-muted mt-2">正在搜索...</p>
            </div>

            <div id="blockedArea" class="d-none">
                <div class="blocked-card mx-auto">
                    <div class="card border-danger shadow-sm">
                        <div class="card-body text-center p-4">
                            <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                            <h5 class="text-danger mt-3">借阅功能已锁定</h5>
                            <p class="text-muted">您的信誉分不足，当前无法借书。请通过捐书或等待信誉恢复。</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="bookList" class="row g-4"></div>

            <div id="popularSection" class="mb-5">
                <h5 class="mb-3" style="color:#FF6699;"><i class="bi bi-fire me-2"></i>热门推荐</h5>
                <div id="popularList" class="row g-3">
                    <div class="col-12 text-center py-3">
                        <div class="spinner-border spinner-border-sm text-secondary"></div>
                        <span class="text-muted ms-2">加载中...</span>
                    </div>
                </div>
            </div>

            <div id="emptyArea" class="text-center py-5 d-none">
                <i class="bi bi-inbox text-muted" style="font-size: 3rem;"></i>
                <p class="text-muted mt-2">没有找到相关图书</p>
            </div>

            <div id="welcomeArea" class="text-center py-5">
                <i class="bi bi-book text-primary" style="font-size: 4rem;"></i>
                <h2 class="mt-3">欢迎来到校园图书馆</h2>
                <p class="text-muted">在上方搜索框输入书名开始探索</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        (function () {
            const user = checkAuthAndRedirect();
            if (!user) return;

            document.getElementById('userDisplay').textContent = user.username;

            const creditBadge = document.getElementById('creditDisplay');
            const creditScore = user.credit_score;
            let creditColor = 'bg-success';
            if (creditScore <= 2) creditColor = 'bg-danger';
            else if (creditScore <= 4) creditColor = 'bg-warning text-dark';
            creditBadge.className = 'badge ' + creditColor + ' credit-badge';
            creditBadge.textContent = '信誉分: ' + creditScore;

            if (creditScore <= 2) {
                document.getElementById('blockedArea').classList.remove('d-none');
            }

            document.getElementById('logoutBtn').addEventListener('click', async function () {
                await apiPost('/auth/logout', {});
                clearAuth();
                window.location.href = 'login.html';
            });

            function renderBooks(books) {
                const container = document.getElementById('bookList');
                container.innerHTML = '';
                books.forEach(b => {
                    const statusBadge = b.can_borrow
                        ? '<span class="badge bg-success status-badge">可借</span>'
                        : '<span class="badge bg-secondary status-badge">' + (b.available_copies > 0 ? b.status : '已借完') + '</span>';
                    const col = document.createElement('div');
                    col.className = 'col-6 col-md-4 col-lg-3';
                    col.innerHTML = `
                        <div class="card book-card shadow-sm h-100" onclick="window.location.href='book.html?id=${b.id}'">
                            <div class="book-cover">
                                ${b.cover_image_url
                                    ? '<img src="' + b.cover_image_url + '" class="w-100 h-100" style="object-fit:cover;" onerror="this.style.display=\'none\'">'
                                    : '<i class="bi bi-book"></i>'}
                            </div>
                            <div class="card-body">
                                <h6 class="card-title text-truncate mb-1">${escapeHtml(b.title)}</h6>
                                <p class="card-text text-muted small mb-2 text-truncate">${escapeHtml(b.author)}</p>
                                <div class="d-flex justify-content-between align-items-center">
                                    ${statusBadge}
                                    <small class="text-muted">${b.available_copies}/${b.total_copies}</small>
                                </div>
                            </div>
                        </div>`;
                    container.appendChild(col);
                });
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            async function doSearch() {
                const q = document.getElementById('searchInput').value.trim();
                const type = document.getElementById('searchType').value;

                document.getElementById('welcomeArea').classList.add('d-none');
                document.getElementById('emptyArea').classList.add('d-none');
                document.getElementById('bookList').innerHTML = '';
                document.getElementById('loadingArea').classList.remove('d-none');

                const result = await apiGet('/books?q=' + encodeURIComponent(q) + '&type=' + type + '&per_page=24');
                document.getElementById('loadingArea').classList.add('d-none');

                if (!result || result.code !== 200) {
                    showToast('搜索失败', 'error');
                    return;
                }

                const data = result.data;
                if (!data.items || data.items.length === 0) {
                    document.getElementById('emptyArea').classList.remove('d-none');
                    return;
                }

                renderBooks(data.items);
            }

            document.getElementById('searchBtn').addEventListener('click', doSearch);
            document.getElementById('searchInput').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') doSearch();
            });

            async function loadPopular() {
                const r = await apiGet('/books/popular?limit=8');
                const container = document.getElementById('popularList');
                if (!r || r.code !== 200 || !r.data.items || r.data.items.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center"><span class="text-muted">暂无推荐数据</span></div>';
                    return;
                }
                container.innerHTML = '';
                r.data.items.forEach(b => {
                    const badge = b.borrow_count > 0
                        ? '<span class="badge position-absolute top-0 end-0 m-1" style="background:#FF6699;font-size:0.7rem;">借过' + b.borrow_count + '次</span>'
                        : '';
                    const col = document.createElement('div');
                    col.className = 'col-6 col-md-3';
                    col.innerHTML = `
                        <div class="card book-card shadow-sm h-100 position-relative" onclick="window.location.href='book.html?id=${b.id}'">
                            ${badge}
                            <div class="book-cover">
                                ${b.cover_image_url
                                    ? '<img src="' + b.cover_image_url + '" class="w-100 h-100" style="object-fit:cover;" onerror="this.style.display=\'none\'">'
                                    : '<i class="bi bi-book"></i>'}
                            </div>
                            <div class="card-body p-2">
                                <h6 class="card-title text-truncate mb-1" style="font-size:0.9rem;">${escapeHtml(b.title)}</h6>
                                <p class="card-text text-truncate mb-0" style="font-size:0.75rem;">${escapeHtml(b.author)}</p>
                            </div>
                        </div>`;
                    container.appendChild(col);
                });
            }
            loadPopular();

            async function pollNotify() {
                const r = await apiGet('/notifications/unread-count');
                const badge = document.getElementById('notifyBadge');
                if (r && r.code === 200 && r.data.count > 0) {
                    badge.textContent = r.data.count > 99 ? '99+' : r.data.count;
                    badge.classList.remove('d-none');
                } else {
                    badge.classList.add('d-none');
                }
            }
            document.getElementById('notifyBell').addEventListener('click', function (e) {
                e.preventDefault();
                window.location.href = 'notifications.html';
            });
            pollNotify();
            setInterval(pollNotify, 30000);
        })();
    </script>
</body>
</html>
