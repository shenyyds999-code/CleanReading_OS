<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知 - 校园图书馆</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(rgba(250,251,254,0.9), rgba(250,251,254,0.9)), url('img/bg.png') center/cover fixed no-repeat; min-height: 100vh; color: #1b1622; }
        .navbar-brand { font-weight: 700; color: var(--accent) !important; }
        .navbar-brand i.bi-book { color: var(--accent); }
        .navbar { background: #ffffff !important; border-bottom: 1px solid #dfe2ea; }
        .navbar .nav-link { color: #5f5a66; }
        .main-content { padding-top: 80px; padding-bottom: 40px; }
        .notify-item { transition: background .15s; background: #ffffff; border-color: #dfe2ea; color: #1b1622; }
        .notify-item:hover { background: #f4f5fa; }
        .notify-unread { border-left: 4px solid var(--accent); background: #f4f5fa; }
        h4 { color: #1b1622; }
        .text-muted { color: #6c757d !important; }
        .btn-outline-primary { color: var(--accent); border-color: var(--accent); }
        .btn-outline-primary:hover { background: var(--accent); color: #fff; }
        .badge.bg-secondary { background: #e9ebf1 !important; color: #5f5a66; }
        .badge.bg-primary { background: var(--accent) !important; }
        .list-group-item { background: #ffffff; border-color: #e6e8ef; color: #1b1622; }
    
        /* Cathay-style square corners */
        .form-control, .form-select, .input-group-text, .btn, .card, .modal-content, .modal-header, .modal-footer, .dropdown-menu, .badge, .alert, .toast, .nav-pills .nav-link, .pagination .page-link, .list-group-item, .navbar-toggler, .form-check-input, .rounded, .rounded-1, .rounded-2, .rounded-3, .rounded-circle, .rounded-pill { border-radius: 0 !important; }
        .navbar { box-shadow: none !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-book me-2"></i><span class="site-name">校园图书馆</span></a>
            <div class="d-flex align-items-center gap-3">
                <a class="text-body" href="index.html" title="返回"><i class="bi bi-arrow-left fs-5"></i></a>
                <a class="text-body" href="settings.html" title="设置"><i class="bi bi-gear fs-5"></i></a>
                <span id="userDisplay" class="text-body"></span>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4><i class="bi bi-bell me-2"></i>通知中心</h4>
                <button id="readAllBtn" class="btn btn-outline-primary btn-sm">全部已读</button>
            </div>

            <div id="loadingArea" class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            <div id="emptyArea" class="text-center py-5 d-none"><i class="bi bi-bell-slash text-muted" style="font-size:3rem;"></i><p class="text-muted mt-2">暂无通知</p></div>
            <div id="notifyList" class="d-none"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js?v=046"></script>
    <script>
        (async function () {
            const user = await checkAuthAndRedirect();
            if (!user) return;
            document.getElementById('userDisplay').textContent = user.username;

            async function load() {
                const r = await apiGet('/notifications?per_page=50');
                document.getElementById('loadingArea').classList.add('d-none');
                if (!r || r.code !== 200 || !r.data.items || r.data.items.length === 0) {
                    document.getElementById('emptyArea').classList.remove('d-none');
                    return;
                }
                document.getElementById('notifyList').classList.remove('d-none');
                document.getElementById('notifyList').innerHTML = r.data.items.map(n => `
                    <div class="list-group-item notify-item ${n.is_read ? '' : 'notify-unread'}">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <strong>${escHtml(n.title)}</strong>
                                <span class="badge bg-secondary ms-2">${escHtml(n.type)}</span>
                                ${n.is_read ? '' : '<span class="badge bg-primary ms-1">新</span>'}
                                <p class="text-muted small mb-0 mt-1">${escHtml(n.content)}</p>
                            </div>
                            <div class="d-flex flex-column align-items-end gap-1">
                                <small class="text-muted">${n.created_at}</small>
                                ${n.is_read ? '' : '<button class="btn btn-sm btn-outline-primary read-btn" data-id="' + n.id + '">已读</button>'}
                            </div>
                        </div>
                    </div>`).join('');

                document.querySelectorAll('.read-btn').forEach(b => b.addEventListener('click', async function () {
                    const id = this.dataset.id;
                    const r = await apiPost('/notifications/' + id + '/read', {});
                    if (r && r.code === 200) load();
                }));
            }

            document.getElementById('readAllBtn').addEventListener('click', async function () {
                this.disabled = true;
                const r = await apiPost('/notifications/read-all', {});
                this.disabled = false;
                if (r && r.code === 200) load();
            });

            function escHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

            load();
        })();
    </script>
    <script src="js/live2d-widget.js"></script>
</body>
</html>
