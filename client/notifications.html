<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知 - 校园图书馆</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #2E3134 url('img/bg.png') center/cover fixed no-repeat; background-blend-mode: overlay; min-height: 100vh; }
        .navbar-brand { font-weight: 700; }
        .navbar { background: #24272a !important; border-bottom: 1px solid #4a5056; }
        .main-content { padding-top: 80px; padding-bottom: 40px; }
        .notify-item { transition: background .15s; background: #363b3f; border-color: #4a5056; color: #e0e0e0; }
        .notify-item:hover { background: #3e4347; }
        .notify-unread { border-left: 4px solid #FF6699; background: #2d3033; }
        h4 { color: #e0e0e0; }
        .text-muted { color: #888 !important; }
        .btn-outline-primary { color: #FF6699; border-color: #FF6699; }
        .btn-outline-primary:hover { background: #FF6699; color: #fff; }
        .badge.bg-secondary { background: #4a5056 !important; }
        .badge.bg-primary { background: #FF6699 !important; }
        .list-group-item { background: #363b3f; border-color: #4a5056; color: #e0e0e0; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-book me-2"></i>校园图书馆</a>
            <div class="d-flex align-items-center gap-3">
                <a class="text-white" href="settings.html" title="设置"><i class="bi bi-gear fs-5"></i></a>
                <span id="userDisplay" class="text-white"></span>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4><i class="bi bi-bell me-2"></i>通知中心</h4>
                <button id="readAllBtn" class="btn btn-outline-primary btn-sm">全部已读</button>
            </div>

            <div id="loadingArea" class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            <div id="emptyArea" class="text-center py-5 d-none"><i class="bi bi-bell-slash text-muted" style="font-size:3rem;"></i><p class="text-muted mt-2">暂无通知</p></div>
            <div id="notifyList" class="d-none"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        (function () {
            const user = checkAuthAndRedirect();
            if (!user) return;
            document.getElementById('userDisplay').textContent = user.username;

            async function load() {
                const r = await apiGet('/notifications?per_page=50');
                document.getElementById('loadingArea').classList.add('d-none');
                if (!r || r.code !== 200 || !r.data.items || r.data.items.length === 0) {
                    document.getElementById('emptyArea').classList.remove('d-none');
                    return;
                }
                document.getElementById('notifyList').classList.remove('d-none');
                document.getElementById('notifyList').innerHTML = r.data.items.map(n => `
                    <div class="list-group-item notify-item ${n.is_read ? '' : 'notify-unread'}">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <strong>${escHtml(n.title)}</strong>
                                <span class="badge bg-secondary ms-2">${escHtml(n.type)}</span>
                                ${n.is_read ? '' : '<span class="badge bg-primary ms-1">新</span>'}
                                <p class="text-muted small mb-0 mt-1">${escHtml(n.content)}</p>
                            </div>
                            <div class="d-flex flex-column align-items-end gap-1">
                                <small class="text-muted">${n.created_at}</small>
                                ${n.is_read ? '' : '<button class="btn btn-sm btn-outline-primary read-btn" data-id="' + n.id + '">已读</button>'}
                            </div>
                        </div>
                    </div>`).join('');

                document.querySelectorAll('.read-btn').forEach(b => b.addEventListener('click', async function () {
                    const id = this.dataset.id;
                    const r = await apiPost('/notifications/' + id + '/read', {});
                    if (r && r.code === 200) load();
                }));
            }

            document.getElementById('readAllBtn').addEventListener('click', async function () {
                this.disabled = true;
                const r = await apiPost('/notifications/read-all', {});
                this.disabled = false;
                if (r && r.code === 200) load();
            });

            function escHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

            load();
        })();
    </script>
</body>
</html>
