<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 校园图书馆借阅系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(rgba(250,251,254,0.92), rgba(250,251,254,0.92)), url('img/bg.png') center/cover fixed no-repeat; min-height: 100vh; display: flex; flex-direction: column; color: #1b1622; }

        /* 顶部导航栏 */
        .top-nav { background: #ffffff; border-bottom: 1px solid #dfe2ea; padding: 0 clamp(1rem, 4vw, 2.5rem); height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .top-nav .brand { color: var(--accent); font-weight: 700; font-size: 1.15rem; text-decoration: none; letter-spacing: .5px; }
        .top-nav .nav-links { display: flex; align-items: center; gap: 1.25rem; }
        .top-nav .nav-link-item { color: #5f5a66; text-decoration: none; font-size: 0.925rem; }
        .top-nav .nav-link-item:hover { color: var(--accent); }
        .top-nav .btn-login { color: var(--accent); border: 1px solid var(--accent); border-radius: 0; padding: .45rem 1.1rem; font-size: .9rem; text-decoration: none; transition: all .15s; }
        .top-nav .btn-login:hover { background: var(--accent); color: #fff; }

        /* 主体 */
        .main-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
        .register-panel { width: 100%; max-width: 440px; }
        .register-box { background: #ffffff; border: 1px solid #dfe2ea; border-radius: 0; box-shadow: 0 8px 32px rgba(27,22,34,0.10); padding: 2.5rem; }
        .register-title { font-size: 1.75rem; font-weight: 700; color: #1b1622; margin-bottom: .35rem; }
        .register-subtitle { color: #5f5a66; margin-bottom: 1.75rem; }

        /* 直角输入框 */
        .form-control { border-radius: 0; background: #ffffff; border-color: #d5d9e3; color: #1b1622; padding: .75rem .9rem; }
        .form-control:focus { background: #ffffff; border-color: var(--accent); color: #1b1622; box-shadow: 0 0 0 0.2rem var(--accent-alpha15); }
        .form-control::placeholder { color: #9c98a6; }
        .form-control:-webkit-autofill,
        .form-control:-webkit-autofill:hover,
        .form-control:-webkit-autofill:focus { -webkit-text-fill-color: #1b1622; -webkit-box-shadow: 0 0 0 1000px #ffffff inset; transition: background-color 5000s ease-in-out 0s; }
        .form-label { color: #5f5a66; font-size: .9rem; }

        /* 直角按钮 */
        .btn-primary { border-radius: 0; background: var(--accent); border-color: var(--accent); padding: .8rem; font-size: 1rem; }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .text-muted { color: #6c757d !important; }
        .text-primary { color: var(--accent) !important; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <nav class="top-nav">
        <a href="index.html" class="brand"><span class="site-name">校园图书馆</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-link-item">返回首页</a>
            <a href="login.html" class="btn-login">立即登录</a>
        </div>
    </nav>

    <main class="main-area">
        <div class="register-panel">
            <div class="register-box">
                <div id="registerOpen">
                    <h1 class="register-title">注册</h1>
                    <p class="register-subtitle">创建新账户，开始你的阅读之旅</p>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="username" placeholder="2-80个字符" required autocomplete="username" minlength="2" maxlength="80">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">密码</label>
                            <input type="password" class="form-control" id="password" placeholder="至少6位密码" required autocomplete="new-password" minlength="6">
                        </div>
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">确认密码</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="再次输入密码" required autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="registerBtn">注 册</button>
                    </form>

                    <div class="mt-4">
                        <span class="text-muted">已有账户？</span>
                        <a href="login.html" class="text-primary text-decoration-none">立即登录</a>
                    </div>
                </div>

                <div id="registerClosed" class="d-none">
                    <h1 class="register-title">注册通道已关闭</h1>
                    <p class="register-subtitle">本系统已关闭自助注册。请凭学籍号联系图书馆管理员领取账号。</p>
                    <a href="login.html" class="btn btn-primary w-100">返回登录</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js?v=046"></script>
    <script>
        (function () {
            if (isLoggedIn()) {
                window.location.href = 'index.html';
                return;
            }

            fetch('/api/system/config')
                .then(r => r.json())
                .then(data => {
                    if (data.code === 200 && data.data.allow_register === false) {
                        document.getElementById('registerOpen').classList.add('d-none');
                        document.getElementById('registerClosed').classList.remove('d-none');
                    }
                }).catch(() => {});

            const form = document.getElementById('registerForm');
            const btn = document.getElementById('registerBtn');

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (password !== confirmPassword) {
                    showToast('两次输入的密码不一致', 'error');
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>注册中...';

                const result = await apiPost('/auth/register', { username, password });

                btn.disabled = false;
                btn.textContent = '注 册';

                if (!result || result.code !== 200) {
                    showToast(result?.message || '注册失败，请重试', 'error');
                    return;
                }

                saveToken(result.data.token);
                saveUser(result.data.user);
                showToast('注册成功', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            });
        })();
    </script>
</body>
</html>
