<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习中心 - 校园图书馆</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #2E3134 url('img/bg.png') center/cover fixed no-repeat; background-blend-mode: overlay; min-height: 100vh; }
        .navbar-brand { font-weight: 700; color: #FF6699 !important; }
        .navbar-brand i.bi-book { color: #FF6699; }
        .navbar { background: #24272a !important; border-bottom: 1px solid #4a5056; }
        .credit-badge { font-size: 0.85rem; }
        .main-content { padding-top: 80px; padding-bottom: 40px; }
        .quiz-option { cursor: pointer; transition: all .15s; color: #e0e0e0; }
        .quiz-option:hover:not(.selected) { background: #3e4347; }
        .quiz-option.selected { background: #3a4045; border-color: #FF6699; }
        .card { background: #363b3f; border-color: #4a5056; }
        .card-body { color: #e0e0e0; }
        h4, h5, h6 { color: #e0e0e0; }
        .text-muted { color: #888 !important; }
        .form-control, textarea { background: #24272a; border-color: #4a5056; color: #e0e0e0; }
        .form-control:focus, textarea:focus { background: #363b3f; border-color: #FF6699; color: #e0e0e0; box-shadow: 0 0 0 0.2rem rgba(255,102,153,0.25); }
        .btn-primary { background: #FF6699; border-color: #FF6699; }
        .btn-primary:hover { background: #e05580; border-color: #e05580; }
        .btn-outline-secondary { color: #bbb; border-color: #4a5056; }
        .btn-outline-secondary:hover { background: #3e4347; border-color: #5a6066; color: #e0e0e0; }
        .list-group-item { background: #363b3f; border-color: #4a5056; color: #e0e0e0; }
        .title-badge { background: #3a3f44 !important; color: #c084fc !important; }
        .badge.bg-secondary { background: #4a5056 !important; color: #ccc; }
        .badge.bg-warning { background: #3a3010 !important; color: #f0a040; }
        .badge.bg-danger { background: #3a1a1a !important; color: #f87171; }
        .badge.bg-success { background: #1a3a2a !important; color: #4ade80; }
        .alert-danger { background: #3a2d2d; border-color: #dc3545; color: #f87171; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-book me-2"></i>校园图书馆</a>
            <div class="d-flex align-items-center gap-3">
                <span id="creditDisplay" class="badge credit-badge"></span>
                <span id="userDisplay" class="text-white"></span>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <div id="loadingArea" class="text-center py-5"><div class="spinner-border text-primary"></div></div>

            <div id="mainArea" class="d-none">
                <h4 id="pageTitle" class="mb-3"><i class="bi bi-pencil-square me-2"></i>答题闯关</h4>
                <div id="blockedArea" class="d-none"><div class="alert alert-danger">信誉分不足，无法使用学习中心</div></div>
                <div id="quizArea"><p class="text-muted text-center py-4">该图书暂无题目，请选择其他图书</p></div>
                <div id="resultArea" class="d-none"></div>

                <hr>
                <h5 class="mb-3"><i class="bi bi-trophy me-2"></i>已获称号</h5>
                <div id="titlesList" class="mb-4"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        (function () {
            const user = checkAuthAndRedirect();
            if (!user) return;

            const params = new URLSearchParams(window.location.search);
            const bkId = params.get('book_id');

            document.getElementById('userDisplay').textContent = user.username;
            const cb = document.getElementById('creditDisplay');
            const cs = user.credit_score;
            let cc = cs <= 2 ? 'bg-danger' : cs <= 4 ? 'bg-warning text-dark' : 'bg-success';
            cb.className = 'badge ' + cc + ' credit-badge';
            cb.textContent = '信誉分: ' + cs;

            if (cs <= 0) {
                document.getElementById('blockedArea').classList.remove('d-none');
                document.getElementById('quizArea').classList.add('d-none');
            }

            let questions = [];
            const answers = {};

            async function loadQuiz() {
                if (!bkId) {
                    document.getElementById('quizArea').innerHTML = '<p class="text-muted text-center py-4">请从图书详情页进入答题</p>';
                    document.getElementById('loadingArea').classList.add('d-none');
                    document.getElementById('mainArea').classList.remove('d-none');
                    return;
                }

                const r = await apiGet('/learn/questions?book_id=' + bkId + '&limit=5');
                document.getElementById('loadingArea').classList.add('d-none');
                document.getElementById('mainArea').classList.remove('d-none');

                if (r && r.code === 200 && r.data.questions.length > 0) {
                    questions = r.data.questions;
                    const book = await apiGet('/books/' + bkId);
                    document.getElementById('pageTitle').textContent = '《' + (book?.data?.title || '未知') + '》答题闯关';
                    renderQuiz();
                } else {
                    document.getElementById('quizArea').innerHTML = '<p class="text-muted text-center py-4">该图书暂无题目</p>';
                }
            }

            function renderQuiz() {
                const area = document.getElementById('quizArea');
                area.innerHTML = questions.map((q, i) => {
                    let inputHtml = '';
                    if (q.type === 1 && q.options) {
                        inputHtml = q.options.map(opt => `
                            <div class="list-group-item quiz-option" data-q="${q.id}" data-val="${opt}">
                                <input type="radio" name="q${q.id}" class="form-check-input me-2">${escHtml(opt)}
                            </div>`).join('');
                    } else {
                        inputHtml = `<textarea class="form-control answer-input" data-q="${q.id}" rows="2" placeholder="请输入答案"></textarea>`;
                    }
                    return `<div class="card shadow-sm mb-3">
                        <div class="card-body">
                            <h6>${i + 1}. ${escHtml(q.question_text)} <span class="badge bg-secondary ms-2">${q.type === 1 ? '选择' : q.type === 2 ? '填空' : '简答'} ${q.score}分</span></h6>
                            ${inputHtml}
                        </div>
                    </div>`;
                }).join('') + `
                    <button id="submitQuizBtn" class="btn btn-primary btn-lg w-100 mt-2">提交答案</button>`;

                area.querySelectorAll('.quiz-option').forEach(el => {
                    el.addEventListener('click', function () {
                        this.parentElement.querySelectorAll('.quiz-option').forEach(x => x.classList.remove('selected'));
                        this.classList.add('selected');
                        const qid = parseInt(this.dataset.q);
                        answers[qid] = this.dataset.val;
                    });
                });

                area.querySelectorAll('.answer-input').forEach(el => {
                    el.addEventListener('input', function () {
                        answers[parseInt(this.dataset.q)] = this.value;
                    });
                });

                document.getElementById('submitQuizBtn').addEventListener('click', async function () {
                    this.disabled = true; this.textContent = '提交中...';
                    const ans = Object.entries(answers).map(([qid, val]) => ({ question_id: parseInt(qid), answer: val }));
                    const r = await apiPost('/learn/submit', { book_id: parseInt(bkId), answers: ans });
                    this.disabled = false; this.textContent = '提交答案';

                    if (!r || r.code !== 200) { showToast(r?.message || '提交失败', 'error'); return; }

                    const d = r.data;
                    const resultArea = document.getElementById('resultArea');
                    resultArea.classList.remove('d-none');
                    const passedColor = d.passed ? 'text-success' : 'text-danger';
                    resultArea.innerHTML = `
                        <div class="card shadow-sm border-${d.passed ? 'success' : 'danger'}">
                            <div class="card-body text-center">
                                <i class="bi ${d.passed ? 'bi-check-circle text-success' : 'bi-x-circle text-danger'}" style="font-size:3rem;"></i>
                                <h4 class="mt-2 ${passedColor}">${d.passed ? '闯关成功！' : '未通过'}</h4>
                                <p class="fs-5">正确率：${d.score_rate}%（${d.correct_count}/${d.total_questions}）</p>
                                ${d.new_titles.length > 0 ? '<div class="mt-2"><p class="fw-bold">🎉 获得新称号：</p>' + d.new_titles.map(t => '<span class="badge bg-warning text-dark title-badge"><i class="bi bi-star-fill"></i> ' + escHtml(t.title_name) + '</span>').join('') + '</div>' : ''}
                            </div>
                        </div>`;
                });
            }

            async function loadTitles() {
                const r = await apiGet('/learn/titles');
                const container = document.getElementById('titlesList');
                if (r && r.code === 200 && r.data.titles.length > 0) {
                    container.innerHTML = r.data.titles.map(t =>
                        '<span class="title-badge bg-warning text-dark"><i class="bi bi-star-fill"></i> ' + escHtml(t.title_name) + '</span>'
                    ).join('');
                } else {
                    container.innerHTML = '<span class="text-muted">暂无称号，快去答题获取吧！</span>';
                }
            }

            function escHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

            loadQuiz();
            loadTitles();
        })();
    </script>
</body>
</html>
