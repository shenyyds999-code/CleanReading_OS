<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 校园图书馆借阅系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(rgba(250,251,254,0.92), rgba(250,251,254,0.92)), url('img/bg.png') center/cover fixed no-repeat; min-height: 100vh; display: flex; flex-direction: column; color: #1b1622; }

        /* 顶部导航栏 */
        .top-nav { background: #ffffff; border-bottom: 1px solid #dfe2ea; padding: 0 clamp(1rem, 4vw, 2.5rem); height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .top-nav .brand { color: var(--accent); font-weight: 700; font-size: 1.15rem; text-decoration: none; letter-spacing: .5px; }
        .top-nav .nav-links { display: flex; align-items: center; gap: 1.25rem; }
        .top-nav .nav-link-item { color: #5f5a66; text-decoration: none; font-size: 0.925rem; }
        .top-nav .nav-link-item:hover { color: var(--accent); }
        .top-nav .btn-register { color: var(--accent); border: 1px solid var(--accent); border-radius: 0; padding: .45rem 1.1rem; font-size: .9rem; text-decoration: none; transition: all .15s; }
        .top-nav .btn-register:hover { background: var(--accent); color: #fff; }

        /* 主体 */
        .main-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
        .login-panel { width: 100%; max-width: 440px; }
        .login-box { background: #ffffff; border: 1px solid #dfe2ea; border-radius: 0; box-shadow: 0 8px 32px rgba(27,22,34,0.10); padding: 2.5rem; }
        .login-title { font-size: 1.75rem; font-weight: 700; color: #1b1622; margin-bottom: .35rem; }
        .login-subtitle { color: #5f5a66; margin-bottom: 1.75rem; }

        /* 直角输入框 */
        .form-control { border-radius: 0; background: #ffffff; border-color: #d5d9e3; color: #1b1622; padding: .75rem .9rem; }
        .form-control:focus { background: #ffffff; border-color: var(--accent); color: #1b1622; box-shadow: 0 0 0 0.2rem var(--accent-alpha15); }
        .form-control::placeholder { color: #9c98a6; }
        .form-control:-webkit-autofill,
        .form-control:-webkit-autofill:hover,
        .form-control:-webkit-autofill:focus { -webkit-text-fill-color: #1b1622; -webkit-box-shadow: 0 0 0 1000px #ffffff inset; transition: background-color 5000s ease-in-out 0s; }
        .form-label { color: #5f5a66; font-size: .9rem; }

        /* 直角按钮 */
        .btn-primary { border-radius: 0; background: var(--accent); border-color: var(--accent); padding: .8rem; font-size: 1rem; }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .text-muted { color: #6c757d !important; }
        .text-primary { color: var(--accent) !important; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <nav class="top-nav">
        <a href="index.html" class="brand"><span class="site-name">校园图书馆</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-link-item">返回首页</a>
            <a href="register.html" class="btn-register" id="navRegisterBtn">免费注册</a>
        </div>
    </nav>

    <main class="main-area">
        <div class="login-panel">
            <div class="login-box">
                <h1 class="login-title">登录</h1>
                <p class="login-subtitle">登录你的账户，继续阅读之旅</p>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" placeholder="请输入用户名" required autocomplete="username">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">密码</label>
                        <input type="password" class="form-control" id="password" placeholder="请输入密码" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="loginBtn">登 录</button>
                </form>

                <div class="mt-4" id="registerHint">
                    <span class="text-muted">还没有账户？</span>
                    <a href="register.html" class="text-primary text-decoration-none">立即注册</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js?v=046"></script>
    <script>
        (function () {
            if (isLoggedIn()) {
                window.location.href = 'index.html';
                return;
            }

            fetch('/api/system/config')
                .then(r => r.json())
                .then(data => {
                    if (data.code === 200 && data.data.allow_register === false) {
                        document.getElementById('navRegisterBtn').classList.add('d-none');
                        document.getElementById('registerHint').classList.add('d-none');
                    }
                }).catch(() => {});

            const form = document.getElementById('loginForm');
            const btn = document.getElementById('loginBtn');

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>登录中...';

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                const result = await apiPost('/auth/login', { username, password });

                btn.disabled = false;
                btn.textContent = '登 录';

                if (!result || result.code !== 200) {
                    showToast(result?.message || '登录失败，请重试', 'error');
                    return;
                }

                saveToken(result.data.token);
                saveUser(result.data.user);
                showToast('登录成功', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            });
        })();
    </script>
</body>
</html>
