<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 校园图书馆借阅系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; min-height: 100vh; display: flex; align-items: center; }
        .login-card { max-width: 420px; width: 100%; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 login-card">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-primary">校园图书馆</h3>
                            <p class="text-muted">登录你的账户</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">用户名</label>
                                <input type="text" class="form-control" id="username" placeholder="请输入用户名" required autocomplete="username">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">密码</label>
                                <input type="password" class="form-control" id="password" placeholder="请输入密码" required autocomplete="current-password">
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="loginBtn">登 录</button>
                        </form>

                        <div class="text-center mt-3">
                            <span class="text-muted">还没有账户？</span>
                            <a href="register.html" class="text-primary text-decoration-none">立即注册</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        (function () {
            if (isLoggedIn()) {
                window.location.href = 'index.html';
                return;
            }

            const form = document.getElementById('loginForm');
            const btn = document.getElementById('loginBtn');

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>登录中...';

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                const result = await apiPost('/auth/login', { username, password });

                btn.disabled = false;
                btn.textContent = '登 录';

                if (!result || result.code !== 200) {
                    showToast(result?.message || '登录失败，请重试', 'error');
                    return;
                }

                saveToken(result.data.token);
                saveUser(result.data.user);
                showToast('登录成功', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            });
        })();
    </script>
</body>
</html>
